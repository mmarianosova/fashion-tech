<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Textile Flow: replay preview</title><meta name="robots" content="noindex">
<style>/*CSS*/</style></head>
<body class="demo"><div class="app" id="app"></div>
<script>
/*FRAMES*/
// A recorded run of the real app code (Intake Agent -> held items -> Disposition Agent -> pickup approvals -> alerts), replayed as the phone screens.
// Whatever is chosen on a card, the recorded story continues the same way: this is a demo, not the live app.
const S = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = { back: S('<path d="m15 5-7 7 7 7"/>'), check: S('<path d="m5 12.5 4.5 4.5L19 7.5"/>'), x: S('<path d="M6 6l12 12M18 6 6 18"/>'),
  label: S('<path d="M4 12V5a1 1 0 0 1 1-1h7l8 8-8 8-8-8Z"/><circle cx="8.5" cy="8.5" r="1.3"/>'),
  truck: S('<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>'),
  bell: S('<path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9Z"/><path d="M10 20a2 2 0 0 0 4 0"/>'),
  wrench: S('<path d="M14.5 6.5a4 4 0 0 0 4.9 4.9L21 13l-8 8-3-3 8-8-1.5-1.5ZM5 15l-2 2 4 4 2-2"/>'),
  person: S('<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-4 3.5-6 7-6s6.2 2 7 6"/>'),
  trash: S('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'), flag: S('<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>'),
  question: S('<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/>') };
const PILE = { shred: ['Shred pile', 'mostly natural fibres, like cotton'], denim: ['Denim pile', 'jeans and denim'], mixed: ['Mixed pile', 'mixed or man-made fabric'], trash: ['Throw away', 'cannot be reused'] };
const ROUTE = { donate: 'Donation', recycle_shred: 'Fabric shredding', recycle_denim: 'Denim recycling', recycle_mixed: 'Mixed fabric recycling', dispose: 'Disposal' };
const TITLE = { donate_recycle_due: 'Pickup ready', review_waiting: 'Needs a decision', dispute_deadline: 'Deadline coming', delay_risk: 'Possible delay', question: 'A question for you' };
const ITEM = Object.fromEntries(FRAMES[0].items.map((i) => [i[0], { garment: i[1], color: i[2] }]));
const esc = (x) => String(x ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (d) => (d ? new Date(d + 'T00:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }) : '');
const plural = (n, a, b) => `${n} ${n === 1 ? a : (b || a + 's')}`;
const pile = (s) => (PILE[s] ? PILE[s][0] : 'Not sure');
const short = (it = []) => (it.length > 6 ? it.slice(0, 6).join(', ') + ' and ' + (it.length - 6) + ' more' : it.join(', '));

const st = { fi: 0, screen: 'home', sheet: null, sent: {}, msgs: [], seen: {}, toast: null, timer: null, exit: null, doc: null };
const F = () => FRAMES[st.fi];
const pendRev = () => F().reviews.filter((r) => r.state === 'pending');
const pendApp = () => F().approvals.filter((a) => a.state === 'pending');
const alerts = () => [...st.msgs, ...F().alerts];
const unread = () => alerts().filter((a) => !st.seen[a.id]).length;

function stopPlay() { clearInterval(st.timer); st.timer = null; }
function play() {
  if (st.timer) return;
  st.timer = setInterval(() => {
    const f = F();
    if (f.gate || st.fi >= FRAMES.length - 1 || f.phase === 'intake_done' || f.phase === 'disp_done') { stopPlay(); render(); return; }
    st.fi++; render();
    if (F().gate || F().phase === 'intake_done' || F().phase === 'disp_done') stopPlay();
  }, 420);
}
// A person decided the current gate: the run moves on.
function decided(msg) { st.fi = Math.min(st.fi + 1, FRAMES.length - 1); st.exit = null; st.sheet = null; say(msg); play(); render(); }
function say(m) { st.toast = m; clearTimeout(say.t); say.t = setTimeout(() => { st.toast = null; render(); }, 2400); }

const topbar = (title) => `<header class="top"><button class="back" data-act="home">${I.back}Home</button><h1>${esc(title)}</h1></header>`;
const done = (ic, h, p) => `<div class="done"><div class="tick">${ic}</div><h2>${h}</h2><p>${p}</p></div>`;
const sheet = (title, sub, body, back) => `<div class="sheet-bg" data-act="closesheet"><div class="sheet" data-stop="1"><h3>${esc(title)}</h3>${sub ? `<p class="s">${esc(sub)}</p>` : ''}${body}<button class="cancel" data-act="${back || 'closesheet'}">Go back</button></div></div>`;
const opt = (ic, t, d, act, tone = '', arg = '') => `<button class="opt ${tone}" data-act="${act}" data-arg="${esc(arg)}"><span class="ic">${ic}</span><span><b>${esc(t)}</b>${d ? `<span class="d">${esc(d)}</span>` : ''}</span></button>`;
const choices = (no, yes) => `<div class="choices"><button class="btn-no" data-act="no">${I.x}${no}</button><button class="btn-yes" data-act="yes">${I.check}${yes}</button></div>`;

function home() {
  const f = F(), rv = pendRev().length, ap = pendApp().length, un = unread(), needs = rv + ap;
  const seen = f.items.filter((i) => i[4] !== 'pending').length;
  let start;
  if (st.timer && f.phase === 'intake') start = `<h3><span class="spin"></span>Reading your labels…</h3><div class="prog"><i style="width:${(seen / f.items.length) * 100}%"></i></div><p>${seen} of ${f.items.length} done. Anything under 0.80 confidence comes to you as a card.</p>`;
  else if (f.phase === 'start') start = `<h3>A new batch arrived</h3><p>${plural(f.items.length, 'label')} to read. The agent reads and tags each one, and holds only the ones it is unsure of.</p><button class="big go" data-act="startintake">Start reading labels</button>`;
  else if (f.phase === 'intake' && !f.gate) start = `<h3>Reading paused</h3><p>Tap the yellow bar when it appears.</p>`;
  else if (f.phase === 'intake') start = `<h3>Waiting for you</h3><p>The agent has paused on a label. It will carry on as soon as you decide.</p>`;
  else if (f.phase === 'intake_done') start = `<h3>Due items</h3><p>This runs by itself every day. You can also run it now.</p><button class="big go" data-act="startdisp">Run now</button>`;
  else if (f.phase === 'disp' && st.timer) start = `<h3><span class="spin"></span>Looking for items that are due…</h3><p>Pickups that need your yes will appear on Approve pickups.</p>`;
  else if (f.phase === 'disp') start = `<h3>Waiting for you</h3><p>The agent has paused on a pickup. It will carry on as soon as you decide.</p>`;
  else start = `<h3>Today’s review is done ✓</h3><p>${plural(f.pickups.length, 'pickup')} booked. It runs again by itself tomorrow.</p>`;
  const banner = needs > 0 ? `<button class="need" data-act="${rv ? 'check' : 'pickups'}">${I.bell}<span>${plural(needs, 'thing')} need${needs === 1 ? 's' : ''} you<small>Tap to start</small></span></button>`
    : `<div class="need ok">${I.check}<span>You are all caught up<small>Nothing is waiting for you</small></span></div>`;
  const tile = (cls, act, ic, t, d, n) => `<button class="tile ${cls}" data-act="${act}"><span class="ic">${ic}</span><span><b>${t}</b><span class="d">${d}</span></span><span class="n ${n ? '' : 'zero'}">${n}</span></button>`;
  return `<div class="hello"><div class="eyebrow">Textile Flow · ${esc(f.today)}</div><h1>What would you like to do?</h1></div><main class="page">${banner}
    ${tile('', 'check', I.label, 'Check labels', 'Confirm what the agent could not be sure of', rv)}
    ${tile('t2', 'pickups', I.truck, 'Approve pickups', 'Say yes before a recycler is booked', ap)}
    ${tile('t3', 'messages', I.bell, 'Messages', 'Alerts about what is due and what to do', un)}
    <section class="start">${start}</section></main>`;
}

function reviewFace(r, withChip) {
  const it = ITEM[r.item] || {}, who = st.sent[r.id];
  return `<div class="sc-head"><span class="sc-key">${esc(r.item)}</span><span class="chip-gate">${who ? 'With ' + esc(who) : 'Needs a look'}</span></div>
    <div class="what">${esc([it.color, it.garment].filter(Boolean).join(' '))}</div>
    <div class="label-box"><div class="k">The label says</div><div class="v">${esc(r.label || 'Nothing could be read')}</div></div>
    <div class="think"><div class="k">The agent thinks</div><div class="big-t">${r.proposed ? pile(r.proposed.stream) : 'It is not sure'}</div><div class="why">${esc(r.reason)}</div></div><div class="ask">Is that right?</div>`;
}
function approvalFace(a) {
  const i = a.input || {}, p = PARTNERS[i.partner_id] || {}, who = st.sent[a.id];
  return `<div class="sc-head"><span class="sc-key">${esc(ROUTE[i.route] || i.route)}</span><span class="chip-gate">${who ? 'With ' + esc(who) : 'Needs a yes'}</span></div>
    <div class="think"><div class="k">Who collects</div><div class="big-t" style="font-size:1.3rem">${esc(p.name || i.partner_id)}</div><div class="why">${esc(p.address || '')}</div></div>
    <div class="row" style="justify-content:space-between"><div><div class="k">Hand over by</div><div class="dl">${fmt(i.deadline)}</div></div><div style="text-align:right"><div class="k">Items</div><div class="dl" style="color:var(--ink)">${(i.items || []).length}</div></div></div>
    <div class="items-line">${esc(short(i.items))}</div><div class="ask">Book this pickup?</div>`;
}
// queue: items already sent to someone stay in the queue, behind the ones nobody has looked at
const queue = (list) => [...list].sort((a, b) => Number(!!st.sent[a.id]) - Number(!!st.sent[b.id]));

function check() {
  const q = queue(pendRev()), t = q[0], n = q[1];
  if (!t) return topbar('Check labels') + `<main class="page">${st.timer && F().phase === 'intake' ? done('<span class="spin" style="margin:0"></span>', 'Still reading labels', 'Your next card appears here as soon as the agent is unsure about one.') : done(I.check, 'Nothing to check', 'When the agent is unsure about a label, it shows up here.')}</main>`;
  return topbar('Check labels') + `<main class="page"><div class="count">${plural(q.length, 'card')} left</div><div class="deck">
    ${n ? `<div class="sc next gate">${reviewFace(n)}</div>` : ''}<div class="sc gate top-card" id="card" style="${st.exit ? `transform:translateX(${st.exit === 'right' ? 560 : -560}px) rotate(${st.exit === 'right' ? 20 : -20}deg);transition:transform .22s` : ''}">
    <span class="stamp yes">YES</span><span class="stamp no">NOT RIGHT</span>${reviewFace(t)}</div></div>
    ${choices('Not right', 'Yes, right')}<p class="hint">Swipe the card right for yes, left for not right.</p></main>`;
}
function pickups() {
  const q = queue(pendApp()), t = q[0], n = q[1], booked = F().pickups;
  if (!t && st.timer && F().phase === 'disp') return topbar('Approve pickups') + `<main class="page">${done('<span class="spin" style="margin:0"></span>', 'Looking for items that are due', 'Pickup proposals appear here for your yes.')}</main>`;
  if (!t && !booked.length) return topbar('Approve pickups') + `<main class="page">${done(I.check, 'Nothing to approve', 'When the agent finds items that are due, its pickup proposals show up here.')}</main>`;
  if (!t) return topbar('Approve pickups') + `<main class="page"><div class="count">${plural(booked.length, 'pickup')} booked</div>${booked.map((p) => `<div class="note"><div class="note-ico n-ok">${I.truck}</div><div><h4>${ROUTE[p.route] || p.route}</h4><p>${esc((PARTNERS[p.partner] || {}).name)}</p><p class="nx">Hand over by ${fmt(p.deadline)} · ${plural(p.n, 'item')}</p><button class="alt" style="margin-top:8px;min-height:44px;padding:8px 16px" data-act="doc" data-arg="${esc(p.id)}">Open pickup request</button></div></div>`).join('')}</main>`;
  return topbar('Approve pickups') + `<main class="page"><div class="count">${plural(q.length, 'pickup')} left</div><div class="deck" style="height:400px">
    ${n ? `<div class="sc next gate">${approvalFace(n)}</div>` : ''}<div class="sc gate top-card" id="card" style="${st.exit ? `transform:translateX(${st.exit === 'right' ? 560 : -560}px) rotate(${st.exit === 'right' ? 20 : -20}deg);transition:transform .22s` : ''}">
    <span class="stamp yes">YES</span><span class="stamp no">NOT YET</span>${approvalFace(t)}</div></div>${choices('Not yet', 'Yes, book it')}<p class="hint">Swipe right to book, left for other choices.</p></main>`;
}
function messages() {
  const list = alerts(), un = unread();
  const ic = (t) => (t === 'question' ? [I.question, 'n-ask'] : t === 'donate_recycle_due' ? [I.truck, 'n-ok'] : [I.flag, 'n-warn']);
  if (!list.length) return topbar('Messages') + `<main class="page">${done(I.bell, 'No messages', 'Messages from the agents and your team show up here.')}</main>`;
  return topbar('Messages') + `<main class="page">${un ? `<button class="big" style="margin-bottom:12px" data-act="markread">Mark ${un} as read</button>` : ''}${list.map((a) => { const [i, tone] = ic(a.type);
    return `<div class="note ${st.seen[a.id] ? '' : 'unread'}"><div class="note-ico ${tone}">${i}</div><div><h4>${TITLE[a.type] || 'Message'}</h4><p>${esc(a.summary)}</p>${a.deadline ? `<p class="nx">By ${fmt(a.deadline)}</p>` : ''}<p class="nx">${esc(a.next)}</p></div></div>`; }).join('')}</main>`;
}
function sheets() {
  const rv = queue(pendRev())[0], ap = queue(pendApp())[0], who = (act) => PEOPLE.map((p) => opt(I.person, p, '', act, '', p)).join('');
  if (st.sheet === 'rev-options' && rv) return sheet('What should we do with it?', rv.item + ': choose a way forward.', opt(I.wrench, 'Change it', 'Pick the right pile', 'rev-fix') + opt(I.person, 'Send to someone', 'They decide. It stays here until someone answers.', 'rev-who', 'warn') + opt(I.trash, 'Take it out of this batch', 'The agent skips this item', 'rev-remove', 'bad'));
  if (st.sheet === 'rev-fix' && rv) return sheet('Which pile is it?', rv.item + ' — ' + (rv.label || 'no label text'), Object.entries(PILE).map(([k, v]) => opt(I.label, v[0], v[1], 'rev-pile', k === 'trash' ? 'bad' : '', v[0])).join(''), 'rev-options');
  if (st.sheet === 'rev-who' && rv) return sheet('Who should decide?', rv.item + ' stays in the queue until they answer.', who('rev-send'), 'rev-options');
  if (st.sheet === 'app-options' && ap) return sheet('What should we do?', (ROUTE[ap.input.route] || '') + ' pickup for ' + fmt(ap.input.deadline), opt(I.person, 'Send to someone', 'They decide. It stays here until someone answers.', 'app-who', 'warn') + opt(I.x, 'Do not book it', 'The agent is told no and sends an alert', 'app-deny', 'bad'));
  if (st.sheet === 'app-who' && ap) return sheet('Who should decide?', 'The booking stays in the queue until they answer.', who('app-send'), 'app-options');
  if (st.sheet === 'doc') { const p = F().pickups.find((x) => x.id === st.doc) || {}, pt = PARTNERS[p.partner] || {};
    return sheet('Pickup request', '', `<div class="reqdoc"><h4>Pickup request ${esc(p.id)}</h4><p><b>Collector:</b> ${esc(pt.name)}, ${esc(pt.address)}</p><p><b>Type:</b> ${ROUTE[p.route] || ''}</p><p><b>Hand over by:</b> ${fmt(p.deadline)}</p><p><b>Items (${p.n}):</b> ${esc((p.items || []).join(', '))}</p>${p.lots && Object.keys(p.lots).length ? `<p><b>Colour lots:</b> ${Object.entries(p.lots).map(([g, v]) => g + ' ' + v.length).join(', ')}</p>` : ''}</div>`); }
  return '';
}

function render() {
  if (st.dragging) return;
  const strip = `<div class="demo-strip">Demo: a recorded run. Whatever you choose, the story continues the same way.<button data-act="restart">Restart</button></div>`;
  const body = st.screen === 'check' ? check() : st.screen === 'pickups' ? pickups() : st.screen === 'messages' ? messages() : home();
  document.getElementById('app').innerHTML = strip + `<div class="scroll">${body}</div>` + sheets() + (st.toast ? `<div class="toast" role="status">${esc(st.toast)}</div>` : '');
  bindSwipe();
}

function act(a, arg) {
  const rv = queue(pendRev())[0], ap = queue(pendApp())[0];
  const go = { home: 'home', check: 'check', pickups: 'pickups', messages: 'messages' };
  if (go[a]) { st.screen = go[a]; st.sheet = null; render(); return; }
  switch (a) {
    case 'restart': stopPlay(); Object.assign(st, { fi: 0, screen: 'home', sheet: null, sent: {}, msgs: [], seen: {}, toast: null, exit: null }); render(); break;
    case 'startintake': play(); render(); break;
    case 'startdisp': st.fi++; play(); render(); break; // step off the 'intake finished' frame, then the Disposition run plays
    case 'closesheet': st.sheet = null; render(); break;
    case 'markread': alerts().forEach((x) => (st.seen[x.id] = 1)); render(); break;
    case 'doc': st.doc = arg; st.sheet = 'doc'; render(); break;
    case 'yes': if (st.screen === 'check' && rv && rv.proposed) fly('right', () => decided('Saved. Thank you.')); else if (st.screen === 'pickups' && ap) fly('right', () => decided('Booked. Thank you.')); break;
    case 'no': fly('left', () => { st.exit = null; st.sheet = st.screen === 'check' ? 'rev-options' : 'app-options'; render(); }); break;
    case 'rev-fix': case 'rev-who': case 'rev-options': case 'app-who': case 'app-options': st.sheet = a; render(); break;
    case 'rev-pile': decided('Saved as ' + arg.toLowerCase() + '.'); break;
    case 'rev-remove': decided('Taken out of the batch.'); break;
    case 'app-deny': decided('Not booked.'); break;
    case 'rev-send': case 'app-send': { const t = a === 'rev-send' ? rv : ap; st.sent[t.id] = arg; st.sheet = null;
      st.msgs.unshift({ id: 'local-' + t.id + arg, type: 'question', summary: 'Sent to ' + arg + ': ' + (a === 'rev-send' ? t.item + ' needs a second look. ' + t.reason : 'a ' + (ROUTE[t.input.route] || '').toLowerCase() + ' pickup needs a second look.'),
        next: arg + ' to decide. It stays in ' + (a === 'rev-send' ? 'Check labels' : 'Approve pickups') + ' until someone answers.' });
      say('Sent to ' + arg + '.'); render(); break; }
  }
}
function fly(dir, then) { st.exit = dir; render(); setTimeout(then, 230); }

document.addEventListener('click', (e) => {
  if (e.target.closest('[data-stop]') && !e.target.closest('[data-act]')) return;
  const el = e.target.closest('[data-act]'); if (el) act(el.dataset.act, el.dataset.arg);
});
function bindSwipe() {
  const c = document.getElementById('card'); if (!c || st.exit) return;
  let x0 = null, dx = 0; const yes = c.querySelector('.stamp.yes'), no = c.querySelector('.stamp.no');
  c.style.touchAction = 'pan-y';
  c.onpointerdown = (e) => { if (e.target.closest('button')) return; x0 = e.clientX; st.dragging = true; c.setPointerCapture(e.pointerId); };
  c.onpointermove = (e) => { if (x0 === null) return; dx = e.clientX - x0; c.style.transition = 'none'; c.style.transform = `translateX(${dx}px) rotate(${dx / 24}deg)`; yes.style.opacity = Math.max(0, Math.min(1, dx / 90)); no.style.opacity = Math.max(0, Math.min(1, -dx / 90)); };
  c.onpointerup = () => { if (x0 === null) return; x0 = null; st.dragging = false;
    if (dx > 90) act('yes'); else if (dx < -90) act('no'); else { c.style.transition = 'transform .22s'; c.style.transform = ''; yes.style.opacity = no.style.opacity = 0; } dx = 0; };
  c.onpointercancel = () => { x0 = null; st.dragging = false; };
}
render();
</script></body></html>
