<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Textile Flow: demo</title><meta name="robots" content="noindex">
<style>/*CSS*/</style></head>
<body class="demo"><div class="app" id="app"></div>
<script>
/*FRAMES*/
// Demo mode: a recorded run of the real app code, replayed as the phone screens. The work happens in the background by itself;
// the person only decides the items that come up. Whatever is chosen, the recorded story continues the same way. Nothing here is real data.
const S = (d, w = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = { book: S('<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>'), plus: S('<path d="M12 5v14M5 12h14"/>', 2.2), back: S('<path d="M15 6l-6 6 6 6"/>'), check: S('<path d="M5 12l5 5L20 7"/>', 2.4), x: S('<path d="M6 6l12 12M18 6 6 18"/>', 2.2),
  home: S('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
  label: S('<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.2"/>'),
  truck: S('<path d="M3 6h11v10H3z"/><path d="M14 9h4l3 3v4h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>'),
  bell: S('<path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7z"/><path d="M10 20a2 2 0 0 0 4 0"/>'),
  wrench: S('<path d="M4 20h4L19 9l-4-4L4 16z"/>'),
  person: S('<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-4 3.5-6 7-6s6.2 2 7 6"/>'),
  calendar: S('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  trash: S('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'), flag: S('<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>'),
  clock: S('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'), chev: S('<path d="M9 6l6 6-6 6"/>'),
  pin: S('<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>'),
  sig: '<svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>',
  wifi: '<svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.5a9.5 9.5 0 0 1 13 0"/><path d="M4 7.2a6 6 0 0 1 8 0"/><circle cx="8" cy="10" r="1" fill="currentColor"/></svg>',
  batt: '<svg width="26" height="12" viewBox="0 0 26 12" aria-hidden="true"><rect x="0.5" y="0.5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="19" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="1.6" height="4" rx="0.8" fill="currentColor" opacity=".4"/></svg>' };
const PILE = { shred: ['Shred pile', 'mostly natural fibres, like cotton'], denim: ['Denim pile', 'jeans and denim'], mixed: ['Mixed pile', 'mixed or man-made fabric'], trash: ['Throw away', 'cannot be reused'] };
const ROUTE = { donate: 'Donation', recycle_shred: 'Fabric shredding', recycle_denim: 'Denim recycling', recycle_mixed: 'Mixed fabric recycling', dispose: 'Disposal' };
// Material guide: one icon and one plain sentence per category. Used on the pickup card, label card, Edit items and the Pile guide.
const MAT = {
  shred: { name: 'Shred pile', desc: 'Mostly natural fibres such as cotton or wool. Shredded back into loose fibre for stuffing, insulation and new yarn.', eg: 'T-shirts, sweaters, towels', ic: '<path d="M4 7c3-2 5 2 8 0s5-1 8 0"/><path d="M4 12c3-2 5 2 8 0s5-1 8 0"/><path d="M4 17c3-2 5 2 8 0s5-1 8 0"/>' },
  denim: { name: 'Denim pile', desc: 'Jeans and other denim. The cotton is strong, so denim is recycled on its own and spun into new fibre.', eg: 'Jeans, denim jackets, denim shorts', ic: '<path d="M7 3h10l1 18h-5l-1-9-1 9H6z"/><path d="M7 7h10"/>' },
  mixed: { name: 'Mixed pile', desc: 'Blends and man-made fabric such as polyester or nylon. Sent to recyclers that can separate mixed fibres.', eg: 'Leggings, fleece, polyester dresses', ic: '<circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/>' },
  trash: { name: 'Throw away', desc: 'Too damaged or dirty to reuse or recycle. Disposed of safely.', eg: 'Mouldy, soaked or badly torn items', ic: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>' },
  donate: { name: 'Donation', desc: 'Clean items in good, wearable condition. Passed to a charity partner to be worn again.', eg: 'Wearable tops, coats, accessories', ic: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.6-7 10-7 10z"/>' },
};
const ROUTE_MAT = { donate: 'donate', recycle_shred: 'shred', recycle_denim: 'denim', recycle_mixed: 'mixed', dispose: 'trash' };
const matKey = (k) => (MAT[k] ? k : 'mixed');
const tile = (k, size = '') => `<span class="mat m-${matKey(k)} ${size}">${S(MAT[matKey(k)].ic, 1.8)}</span>`;
const TITLE = { rescheduled: 'Pickup rescheduled', reply: 'Reply', donate_recycle_due: 'Pickup ready', review_waiting: 'Item to review', dispute_deadline: 'Deadline coming', delay_risk: 'Possible delay', question: 'A question for you' };
const TAG = { rescheduled: 'PICKUP', reply: 'REPLY', donate_recycle_due: 'PICKUP', review_waiting: 'REVIEW' };
const ITEM = Object.fromEntries(FRAMES[0].items.map((i) => [i[0], { garment: i[1], color: i[2] }]));
const esc = (x) => String(x ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (d) => (d ? new Date(d + 'T00:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }) : '');
const mon = (d) => (d ? new Date(d + 'T00:00:00Z').toLocaleDateString('en-US', { month: 'short', timeZone: 'UTC' }).toUpperCase() : '');
const dom = (d) => (d ? new Date(d + 'T00:00:00Z').getUTCDate() : '');
const plural = (n, a, b) => `${n} ${n === 1 ? a : (b || a + 's')}`;
const pile = (s) => (PILE[s] ? PILE[s][0] : 'Not sure');
const addDays = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
const ids = (it = []) => it.slice(0, 6).map((x) => `<span>${esc(x)}</span>`).join('') + (it.length > 6 ? `<span>+${it.length - 6} more</span>` : '');
const thumb = (k) => { const r = F().items.find((i) => i[0] === k) || []; return r[10] ? `<span class="mat s"><img src="${esc(r[10])}" alt=""></span>` : tile(r[5], 's'); };
const garment = (k) => { const it = ITEM[k] || {}; return [it.color, it.garment].filter(Boolean).join(' '); };

// Demo history: a few earlier decisions so the History screen is not empty. New choices are added on top.
const REVIEWED = new Set(FRAMES.flatMap((f) => f.reviews.map((r) => r.item)));
const LAST = FRAMES[FRAMES.length - 1];
const earlier = LAST.items.filter((i) => !REVIEWED.has(i[0]) && i[5]).slice(0, 2);
const firstPartner = Object.values(PARTNERS)[0] || {};
const shredItems = LAST.items.filter((i) => i[5] === 'shred').slice(0, 3).map((i) => i[0]);
const SEED = [
  ...earlier.map((i) => ({ id: 's-' + i[0], k: 'label', title: `${i[0]} ${garment(i[0])}`.trim(), sub: pile(i[5]), status: 'Accepted', tone: 'ok',
    rev: { id: 'seed-' + i[0], item: i[0], label: i[3], proposed: { stream: i[5] }, reason: 'Fibre content read from the label.' } })),
  { id: 's-pickup', k: 'pickup', title: 'Fabric shredding', sub: `${firstPartner.name || 'Recycler'} · Hand over by ${fmt(addDays(FRAMES[0].today, 3))}`, status: 'Booked', tone: 'book',
    app: { id: 'seed-pickup', input: { route: 'recycle_shred', partner_id: Object.keys(PARTNERS)[0], items: shredItems, deadline: addDays(FRAMES[0].today, 3) } } },
];
let hid = 0;
const seeds = () => (st.mode === 'demo' ? SEED : []);

const st = { fi: 0, screen: 'home', sheet: null, sent: {}, msgs: [], seen: {}, toast: null, timer: null, exit: null, doc: null, open: null, rt: [], hist: [], hf: 'all', removed: {}, added: {}, reopen: null, edit: {}, mode: 'demo', conn: '' };
const BLANK = () => ({ today: new Date().toISOString().slice(0, 10), items: [], reviews: [], approvals: [], pickups: [], alerts: [] });
const LIVE = BLANK();
const F = () => (st.mode === 'live' ? LIVE : FRAMES[st.fi]);
const pendRev = () => F().reviews.filter((r) => r.state === 'pending');
const pendApp = () => F().approvals.filter((a) => a.state === 'pending');
// Demo notice: a pickup nobody confirmed is moved to a later date, and the person is told so.
const notice = () => { if (st.mode !== 'demo') return []; const a = pendApp()[0]; if (!a || !a.input) return []; const i = a.input;
  return [{ id: 'resched-' + a.id, type: 'rescheduled', ref: 'approval', items: i.items || [], summary: `No action was taken on ${ROUTE[i.route] || i.route} (${plural((i.items || []).length, 'item')}), so it was rescheduled to ${fmt(addDays(i.deadline, 7))}. Verify it or change it.`, next: 'Open it in Pickups to review and choose Book pickup, Reschedule or Don’t book.' }]; };
// A decided item can be reopened from History; then it is the one on screen instead of the next waiting item.
const curRev = () => (st.reopen && st.reopen.rev) || queue(pendRev())[0];
const curApp = () => (st.reopen && st.reopen.app) || queue(pendApp())[0];
const alerts = () => [...notice(), ...st.msgs, ...F().alerts];
const baseItems = (a) => [...((a.input && a.input.items) || []), ...(st.added[a.id] || [])];
const itemsOf = (a) => baseItems(a).filter((x) => !(st.removed[a.id] || []).includes(x));
// Other items of the same kind (same pile as this pickup) that are not already in a pickup.
const STREAM = { recycle_denim: 'denim', recycle_shred: 'shred', recycle_mixed: 'mixed' };
const addable = (a) => { if (a.addable_items) return a.addable_items.filter((key) => !baseItems(a).includes(key));
  const taken = new Set([...F().approvals.flatMap((x) => (x.input && x.input.items) || []), ...F().pickups.flatMap((p) => p.items || []), ...baseItems(a)]);
  return F().items.filter((i) => i[5] === STREAM[a.input.route] && !taken.has(i[0])).map((i) => i[0]); };
const unread = () => alerts().filter((a) => !st.seen[a.id]).length;

function stopPlay() { clearInterval(st.timer); st.timer = null; }
// The work runs by itself in the background; it stops only where a person has to decide.
function play() {
  if (st.timer || st.mode === 'live') return;
  st.timer = setInterval(() => {
    if (F().gate || st.fi >= FRAMES.length - 1) { stopPlay(); render(); return; }
    st.fi++; render();
    if (F().gate || st.fi >= FRAMES.length - 1) stopPlay();
  }, 420);
}
// A person decided the current item: the run moves on.
function decided(msg, rec) {
  if (rec && rec.ev) emit({ ...rec.ev, ...(st.reopen ? { reopened: true } : {}) });
  if (st.reopen) { st.edit[st.reopen.rec.id] = { status: rec.status, tone: rec.tone, sub: rec.sub }; st.reopen = null; st.screen = 'history'; st.exit = null; st.sheet = null; say(msg); render(); return; }
  if (rec) st.hist.unshift(rec);
  if (st.mode === 'live') { if (rec && rec.src) { rec.src.state = 'decided'; rec.src._t = Date.now(); } st.exit = null; st.sheet = null; say(msg); render(); return; }
  st.fi = Math.min(st.fi + 1, FRAMES.length - 1); st.exit = null; st.sheet = null; say(msg); play(); render(); }
function say(m) { st.toast = m; clearTimeout(say.t); say.t = setTimeout(() => { st.toast = null; render(); }, 2400); }

const topbar = (title, sub, back = 'home') => `<header class="top"><button class="back" data-act="${back}" aria-label="Back">${I.back}</button><div><h1>${esc(title)}</h1>${sub ? `<p class="lede">${esc(sub)}</p>` : ''}</div></header>`;
const done = (ic, h, p) => `<div class="done"><div class="tick">${ic}</div><h2>${h}</h2><p>${p}</p></div>`;
const sheet = (title, sub, body, back) => `<div class="sheet-bg" data-act="closesheet"><div class="sheet" data-stop="1"><h3>${esc(title)}</h3>${sub ? `<p class="s">${esc(sub)}</p>` : ''}${body}<button class="cancel" data-act="${back || 'closesheet'}">Go back</button></div></div>`;
const opt = (ic, t, d, act, tone = '', arg = '') => `<button class="opt ${tone}" data-act="${act}" data-arg="${esc(arg)}"><span class="ic">${ic}</span><span><b>${esc(t)}</b>${d ? `<span class="d">${esc(d)}</span>` : ''}</span></button>`;
// queue: items already sent to someone stay in the queue, behind the ones nobody has looked at
const queue = (list) => [...list].sort((a, b) => Number(!!st.sent[a.id]) - Number(!!st.sent[b.id]));

function tabbar() {
  const t = (act, ic, label, on, pip) => `<a href="#" role="button" data-act="${act}" aria-label="${label}"${on ? ' aria-current="page"' : ''} class="${on ? 'on' : ''}">${ic}${on ? label : ''}${pip && !on ? '<i class="pip"></i>' : ''}</a>`;
  return `<nav class="tabbar" aria-label="Main">${t('home', I.home, 'Home', st.screen === 'home')}${t('check', I.label, 'Labels', st.screen === 'check', pendRev().length)}${t('pickups', I.truck, 'Pickups', st.screen === 'pickups', pendApp().length)}${t('messages', I.bell, 'Messages', st.screen === 'messages', unread())}${t('history', I.clock, 'History', st.screen === 'history')}</nav>`;
}
const brow = (act, ic, t, d) => `<button data-act="${act}"><span class="bi">${ic}</span><span><b>${t}</b><span class="d">${d}</span></span><span class="go">${I.chev}</span></button>`;

function home() {
  const f = F(), rv = pendRev().length, ap = pendApp().length, un = unread(), needs = rv + ap;
  const nextAp = queue(pendApp())[0], pi = nextAp && nextAp.input ? nextAp.input : null;
  const tile = (act, ic, t, d, n) => `<button class="tile" data-act="${act}"><span class="ic">${ic}</span><span><b>${t}</b><span class="d">${esc(d)}</span></span><span class="n ${n ? '' : 'zero'}">${n}</span></button>`;
  const nPick = f.pickups.length + ap;
  const cta = needs > 0 ? `<button class="big" data-act="${rv ? 'check' : 'pickups'}">Start reviewing</button>`
    : `<div class="need ok">${I.check}<span>You are all caught up<small>Nothing is waiting for you</small></span></div>`;
  return `<div class="hello"><div class="eyebrow"><span class="brand"><span class="logo"></span>Textile Flow</span><span class="date">${esc(fmt(f.today))}</span></div>
    <h1>${needs > 0 ? plural(needs, 'item') + ' to review' : 'All caught up'}</h1></div><main class="page">
    ${tile('check', I.label, 'Labels to review', rv ? 'Fibre content we could not read' : 'Nothing waiting', rv)}
    ${tile('pickups', I.truck, 'Pickups to review', pi ? `${ROUTE[pi.route] || pi.route}, ${(PARTNERS[pi.partner_id] || {}).name || ''}` : 'Nothing waiting', ap)}
    ${cta}
    <div class="sect">Browse</div><div class="browse">
    ${brow('check', I.label, 'All labels', `${f.items.length} in today’s batch`)}
    ${brow('pickups', I.truck, 'All pickups', nPick ? plural(nPick, 'pickup') : 'None yet')}
    ${brow('messages', I.bell, 'Messages', un ? plural(un, 'new alert') : 'No new alerts')}
    ${brow('guide', I.book, 'Pile guide', 'What goes where')}
    ${brow('history', I.clock, 'History', 'Past decisions you can change')}</div></main>`;
}

function reviewFace(r) {
  const who = st.sent[r.id];
  return `<div class="sc-head"><span class="sc-key">${esc(r.item)}</span><span class="chip-gate">${st.reopen && st.reopen.rev === r ? esc(st.reopen.rec.status) : who ? 'With ' + esc(who) : 'To review'}</span></div>
    <div class="what">${esc(garment(r.item))}</div>
    <div class="label-box"><div class="k">The label says</div><div class="v">${esc(r.label || 'Nothing could be read')}</div></div>
    <div class="think"><div class="k">Suggested category</div>${r.proposed ? `<div class="matline">${tile(r.proposed.stream)}<div><div class="big-t">${pile(r.proposed.stream)}</div><div class="why">${esc(MAT[matKey(r.proposed.stream)].desc)}</div></div></div>` : '<div class="big-t">Not sure</div>'}<div class="why" style="margin-top:8px">${esc(r.reason)}</div></div><div class="ask">Is that right?</div>`;
}
function check() {
  const re = st.reopen && st.reopen.rev, q = re ? [re] : queue(pendRev()), t = q[0], n = q[1];
  const head = re ? topbar('Review again', 'Change your decision on this item.', 'hist-back') : topbar('Items to review', 'Labels to review. Swipe right if the suggestion is right, left if not.');
  if (!t) return head + `<main class="page">${st.timer ? done('<span class="spin"></span>', 'Checking labels', 'Anything that needs a second look appears here.') : done(I.check, 'Nothing to review', 'When a label needs a second look, it shows up here.')}</main>`;
  const dots = Array.from({ length: Math.min(q.length, 5) }, (_, i) => `<i class="${i === 0 ? 'on' : ''}"></i>`).join('');
  return head + `<main class="page"><div class="count">${re ? 'You chose: ' + esc(st.reopen.rec.status) : plural(q.length, 'item') + ' left'}</div><div class="deck">
    ${n ? `<div class="sc next gate">${reviewFace(n)}</div>` : ''}<div class="sc gate top-card" id="card" style="${st.exit ? `transform:translateX(${st.exit === 'right' ? 560 : -560}px) rotate(${st.exit === 'right' ? 20 : -20}deg);transition:transform .22s` : ''}">
    <span class="stamp yes">YES</span><span class="stamp no">NO</span>${reviewFace(t)}</div></div>
    <div class="choices three"><button class="btn-no" data-act="no">${I.x}<span class="sr">No</span></button><button class="btn-alt" data-act="rev-fix">${I.wrench}Change this</button><button class="btn-yes" data-act="yes">${I.check}<span class="sr">Yes</span></button></div><div class="dots">${dots}</div></main>`;
}
function pickups() {
  const reA = st.reopen && st.reopen.app, q = reA ? [reA] : queue(pendApp()), t = q[0], n = q[1], booked = F().pickups;
  const head = reA ? topbar('Review again', 'Change your decision on this pickup.', 'hist-back') : topbar('Pickups to review', 'Confirm each pickup before the recycler is booked.');
  if (!t && st.timer) return head + `<main class="page">${done('<span class="spin"></span>', 'Looking for items that are due', 'Pickups to review appear here.')}</main>`;
  if (!t && !booked.length) return head + `<main class="page">${done(I.check, 'Nothing to review', 'When items are due to leave, their pickups show up here.')}</main>`;
  if (!t) return head + `<main class="page"><div class="count">${plural(booked.length, 'pickup')} booked</div>${booked.map((p) => `<div class="note">${tile(ROUTE_MAT[p.route])}<div><h4>${ROUTE[p.route] || p.route}</h4><p>${esc((PARTNERS[p.partner] || {}).name)}</p><p class="nx">Hand over by ${fmt(p.deadline)} · ${plural(p.n, 'item')}</p><button class="alt" style="margin-top:8px;min-height:44px;padding:8px 16px" data-act="doc" data-arg="${esc(p.id)}">Open pickup request</button></div></div>`).join('')}</main>`;
  const i = t.input || {}, p = PARTNERS[i.partner_id] || {}, who = st.sent[t.id], ni = n && n.input ? n.input : null;
  return head + `<main class="page"><div class="pick">
    <div class="head"><b>${esc(ROUTE[i.route] || i.route)}</b><span class="chip-gate" style="margin-left:0">${reA ? esc(st.reopen.rec.status) : who ? 'With ' + esc(who) : 'To review'}</span></div>
    <div class="matrow">${tile(ROUTE_MAT[i.route])}<div><b>${esc((MAT[matKey(ROUTE_MAT[i.route])] || {}).name)}</b><span class="d">${esc((MAT[matKey(ROUTE_MAT[i.route])] || {}).desc)}</span></div></div>
    <div class="when"><div class="cal"><span>${mon(i.deadline)}</span><strong>${dom(i.deadline)}</strong></div><div><div class="k">Hand over by</div><div class="who">${esc(p.name || i.partner_id)}</div><div class="addr">${I.pin}${esc(p.address || '')}</div></div></div>
    <div><div class="k-row"><span class="k">Items ${itemsOf(t).length}</span><button class="editlink" data-act="app-edit">${I.wrench}Edit items</button></div><div class="ids">${ids(itemsOf(t))}</div></div>
    <div class="actions"><button class="btn-yes" data-act="yes">Book pickup</button>
    <div class="duo"><button class="btn-alt" data-act="app-date">Reschedule</button><button class="btn-no" data-act="app-deny">Don’t book</button></div>
    <button class="link" data-act="app-options">More options</button></div></div>
    ${ni ? `<div class="upnext"><span style="flex:1"><span class="k">Up next</span><b>${esc(ROUTE[ni.route] || ni.route)} · ${plural((ni.items || []).length, 'item')}</b><small>${esc((PARTNERS[ni.partner_id] || {}).name || '')}</small></span><span style="color:var(--mute);display:flex">${I.chev}</span></div>` : ''}</main>`;
}
function messages() {
  const list = alerts(), head = topbar('Messages', 'What is due and what to do.');
  const ic = (t) => (t === 'reply' ? I.person : (t === 'donate_recycle_due' || t === 'rescheduled') ? I.truck : t === 'review_waiting' ? I.label : I.flag);
  if (!list.length) return head + `<main class="page">${done(I.bell, 'No messages', 'Updates and replies show up here.')}</main>`;
  return head + `<main class="page">${list.map((a) => `<button class="note tap ${st.seen[a.id] ? '' : 'unread'}" data-act="msgopen" data-arg="${esc(a.id)}"><div class="note-ico">${ic(a.type)}</div><div><h4>${esc(msgTitle(a))}</h4><p class="clamp">${esc(a.summary)}</p><span class="tag">${TAG[a.type] || 'ALERT'}</span></div></button>`).join('')}</main>`;
}
const msgTitle = (a) => (a.type === 'reply' && a.from ? a.from + ' replied' : TITLE[a.type] || 'Message');
const msgTarget = (a) => (a.type === 'rescheduled' ? ['pickups', 'Verify or change'] : null) ||  (a.ref === 'review' ? ['check', 'Go to Items to review'] : a.ref === 'approval' ? ['pickups', 'Go to Pickups to review'] : a.type === 'review_waiting' ? ['check', 'Go to Items to review'] : a.type === 'donate_recycle_due' ? ['pickups', 'Go to Pickups'] : null);

function history() {
  const seenAlerts = alerts().filter((a) => st.seen[a.id]).map((a) => ({ k: 'alert', id: a.id, title: msgTitle(a), sub: a.summary, status: 'Seen', tone: 'seen' }));
  const all = [...st.hist, ...seeds()].map((h) => ({ ...h, ...(st.edit[h.id] || {}) }));
  const labels = all.filter((h) => h.k === 'label'), picks = all.filter((h) => h.k === 'pickup'), f = st.hf;
  const row = (h, ic, act, word) => `<div class="hrow"><span class="ic">${ic}</span><span class="t"><b>${esc(h.title)}</b><small>${esc(h.sub)}</small></span><span class="r"><span class="st st-${h.tone}">${esc(h.status)}</span><button class="chg" data-act="${act}" data-arg="${esc(h.id || '')}">${word}</button></span></div>`;
  const grp = (title, rows) => `<div class="hgroup"><div class="sect">${title}</div><div class="hlist">${rows}</div></div>`;
  const chip = (k, t) => `<button class="${f === k ? 'on' : ''}" data-act="hf" data-arg="${k}">${t}</button>`;
  return topbar('History', 'Everything you have decided. Tap Change to look at it again.') + `<main class="page"><div class="chips">${chip('all', 'All')}${chip('labels', 'Labels')}${chip('pickups', 'Pickups')}${chip('alerts', 'Alerts')}</div>
    ${f === 'all' || f === 'labels' ? grp('Label decisions', labels.map((h) => row(h, I.label, 'change', 'Change')).join('')) : ''}
    ${f === 'all' || f === 'pickups' ? grp('Pickups', picks.map((h) => row(h, I.truck, 'change', 'Change')).join('')) : ''}
    ${f === 'all' || f === 'alerts' ? grp('Alerts seen', seenAlerts.length ? seenAlerts.map((h) => row(h, I.bell, 'msgopen', 'Open')).join('') : `<div class="hrow"><span class="t"><small>No alerts seen yet.</small></span></div>`) : ''}</main>`;
}

function guide() {
  return topbar('Pile guide', 'What each pile means and what happens to it.') + `<main class="page">${Object.entries(MAT).map(([k, m]) => `<div class="gcard">${tile(k)}<div><b>${esc(m.name)}</b><p>${esc(m.desc)}</p><small>For example: ${esc(m.eg)}</small></div></div>`).join('')}</main>`;
}
function sheets() {
  const rv = curRev(), ap = curApp(), who = (act) => PEOPLE.map((p) => opt(I.person, p, '', act, '', p)).join('');
  if (st.sheet === 'msg' && st.open) { const m = alerts().find((x) => x.id === st.open), t = m && msgTarget(m); if (m) return sheet(msgTitle(m), (m.items || []).join(', '), `<p class="msg-body">${esc(m.summary)}</p>${m.deadline ? `<p class="msg-body nx">By ${fmt(m.deadline)}</p>` : ''}${m.next ? `<p class="msg-body nx">${esc(m.next)}</p>` : ''}${t ? `<button class="big-link" data-act="${t[0]}">${t[1]}</button>` : ''}`); }
  if (st.sheet === 'rev-options' && rv) return sheet('Not right. What now?', rv.item + ': choose a way forward.', (st.reopen ? '' : opt(I.person, 'Send to someone', 'They decide. It stays here until someone answers.', 'rev-who', 'warn')) + opt(I.trash, 'Delete from pile', 'It is left out of the batch', 'rev-remove', 'bad'));
  if (st.sheet === 'rev-fix' && rv) return sheet('Which pile is it?', rv.item + ' — ' + (rv.label || 'no label text'), Object.entries(PILE).map(([k, v]) => opt(I.label, v[0], v[1], 'rev-pile', k === 'trash' ? 'bad' : '', v[0])).join(''));
  if (st.sheet === 'rev-who' && rv) return sheet('Who should decide?', rv.item + ' stays in the list until they answer.', who('rev-send'), 'rev-options');
  if (st.sheet === 'app-options' && ap) return sheet('What should we do?', (ROUTE[ap.input.route] || '') + ' pickup for ' + fmt(ap.input.deadline), (st.reopen ? '' : opt(I.person, 'Send to someone', 'They decide. It stays here until someone answers.', 'app-who', 'warn')) + opt(I.calendar, 'Reschedule', 'Pick a later hand-over date', 'app-date') + opt(I.x, 'Don’t book it', 'The items come back on the next run.', 'app-deny', 'bad'));
  if (st.sheet === 'app-date' && ap) return sheet('Pick a new date', 'Now: ' + fmt(ap.input.deadline) + '. The pickup is proposed again with the new date.', [3, 7, 14].map((n) => opt(I.calendar, fmt(addDays(ap.input.deadline, n)), n + ' days later', 'app-resched', '', addDays(ap.input.deadline, n))).join(''), 'app-options');
  if (st.sheet === 'app-edit' && ap) { const all = baseItems(ap), gone = st.removed[ap.id] || [], more = addable(ap);
    return sheet('Edit items', 'Tap an item to leave it out of this pickup.', all.map((x) => `<button class="chk ${gone.includes(x) ? '' : 'on'}" data-act="app-toggle" data-arg="${esc(x)}"><span class="bx">${gone.includes(x) ? '' : I.check}</span>${thumb(x)}${esc(x)} ${esc(garment(x))}</button>`).join('')
      + `<div class="sect">Add more items</div>` + (more.length ? more.map((x) => `<button class="chk add" data-act="app-add" data-arg="${esc(x)}"><span class="bx">${I.plus}</span>${thumb(x)}${esc(x)} ${esc(garment(x))}</button>`).join('') : `<p class="msg-body">No other items match this pickup.</p>`)
      + `<button class="big" data-act="closesheet">Done</button>`); }
  if (st.sheet === 'app-who' && ap) return sheet('Who should decide?', 'The booking stays in the list until they answer.', who('app-send'), 'app-options');
  if (st.sheet === 'doc') { const p = F().pickups.find((x) => x.id === st.doc) || {}, pt = PARTNERS[p.partner] || {};
    return sheet('Pickup request', '', `<div class="reqdoc"><h4>Pickup request ${esc(p.id)}</h4><p><b>Collector:</b> ${esc(pt.name)}, ${esc(pt.address)}</p><p><b>Type:</b> ${ROUTE[p.route] || ''}</p><p><b>Hand over by:</b> ${fmt(p.deadline)}</p><p><b>Items (${p.n}):</b> ${esc((p.items || []).join(', '))}</p>${p.lots && Object.keys(p.lots).length ? `<p><b>Colour lots:</b> ${Object.entries(p.lots).map(([g, v]) => g + ' ' + v.length).join(', ')}</p>` : ''}</div>`); }
  return '';
}

function render() {
  if (st.dragging) return;
  const strip = CFG.embed ? '' : st.mode === 'live'
    ? `<div class="demo-strip live">Live · ${esc(CFG.api ? (st.conn || 'connecting') : 'waiting for agent input')}<button data-act="export">Export outputs (${OUT.length})</button>${CFG.locked ? '' : '<button data-act="demo">Back to demo</button>'}</div>`
    : `<div class="demo-strip">Demo with sample data. Whatever you choose, the story continues the same way.<button data-act="restart">Restart</button><button data-act="clear">Clear demo data</button></div>`;
  const sbar = `<div class="sbar" aria-hidden="true">9:41<span>${I.sig}${I.wifi}${I.batt}</span></div>`;
  const body = st.screen === 'check' ? check() : st.screen === 'pickups' ? pickups() : st.screen === 'messages' ? messages() : st.screen === 'history' ? history() : st.screen === 'guide' ? guide() : home();
  document.getElementById('app').innerHTML = sbar + strip + `<div class="scroll">${body}</div>` + tabbar() + sheets() + (st.toast ? `<div class="toast" role="status">${esc(st.toast)}</div>` : '');
  bindSwipe();
}

function act(a, arg) {
  const rv = curRev(), ap = curApp();
  const go = { home: 'home', check: 'check', pickups: 'pickups', messages: 'messages', history: 'history', guide: 'guide' };
  if (go[a]) { st.reopen = null; st.screen = go[a]; st.sheet = null; render(); const sc = document.querySelector('.scroll'); if (sc) sc.scrollTop = 0; return; }
  const pickRec = (status, tone, sub, d = {}) => { const i = ap.input || {}; return { id: 'h' + (++hid), src: ap, ev: { type: 'approval.decision', approval_id: ap.id, route: i.route, partner_id: i.partner_id, items: itemsOf(ap), items_added: st.added[ap.id] || [], items_removed: st.removed[ap.id] || [], ...d }, app: { id: ap.id, input: { ...ap.input, items: itemsOf(ap) } }, k: 'pickup', title: ROUTE[i.route] || i.route, sub: sub || `${(PARTNERS[i.partner_id] || {}).name || ''} · ${plural(itemsOf(ap).length, 'item')} · ${fmt(i.deadline)}`, status, tone }; };
  const labRec = (status, tone, sub, d = {}) => ({ id: 'h' + (++hid), src: rv, ev: { type: 'review.decision', review_id: rv.id, item: rv.item, ...d }, rev: rv, k: 'label', title: `${rv.item} ${garment(rv.item)}`.trim(), sub, status, tone });
  switch (a) {
    case 'restart': stopPlay(); Object.assign(st, { reopen: null, edit: {}, fi: 0, screen: 'home', sheet: null, sent: {}, msgs: [], seen: {}, toast: null, exit: null, open: null, hist: [], hf: 'all', removed: {}, added: {}, reopen: null, edit: {} }); st.rt.forEach(clearTimeout); st.rt = []; render(); play(); break;
    case 'hf': st.hf = arg; render(); break;
    case 'clear': setMode('live'); break;
    case 'demo': setMode('demo'); break;
    case 'export': exportOutputs(); break;
    case 'hist-back': st.reopen = null; st.sheet = null; st.screen = 'history'; render(); break;
    case 'change': { const rec = [...st.hist, ...seeds()].find((h) => h.id === arg); if (!rec) break; st.reopen = { rec, rev: rec.rev, app: rec.app }; st.screen = rec.k === 'label' ? 'check' : 'pickups'; st.sheet = null; render(); const sc = document.querySelector('.scroll'); if (sc) sc.scrollTop = 0; break; }
    case 'app-edit': st.sheet = 'app-edit'; render(); break;
    case 'app-add': (st.added[ap.id] = st.added[ap.id] || []).push(arg); render(); break;
    case 'app-toggle': { const g = st.removed[ap.id] || []; st.removed[ap.id] = g.includes(arg) ? g.filter((x) => x !== arg) : [...g, arg]; if (st.removed[ap.id].length >= baseItems(ap).length) st.removed[ap.id] = g; render(); break; }
    case 'closesheet': st.sheet = null; render(); break;
    case 'msgopen': if (!st.seen[arg]) emit({ type: 'alert.read', alert_id: arg }); st.seen[arg] = 1; st.open = arg; st.sheet = 'msg'; render(); break;
    case 'doc': st.doc = arg; st.sheet = 'doc'; render(); break;
    case 'yes':
      if (st.screen === 'check' && rv && rv.proposed) fly('right', () => decided('Saved. Thank you.', labRec('Accepted', 'ok', pile(rv.proposed.stream), { decision: 'approve', tags: rv.proposed })));
      else if (st.screen === 'pickups' && ap) decided('Booked. Thank you.', pickRec('Booked', 'book', undefined, { decision: 'allow' }));
      break;
    case 'no': fly('left', () => { st.exit = null; st.sheet = 'rev-options'; render(); }); break;
    case 'rev-fix': case 'rev-who': case 'rev-options': case 'app-who': case 'app-options': case 'app-date': st.sheet = a; render(); break;
    case 'rev-pile': decided('Saved as ' + arg.toLowerCase() + '.', labRec('Changed', 'book', arg, { decision: 'edit', tags: { ...(rv.proposed || {}), stream: Object.keys(PILE).find((k) => PILE[k][0] === arg) } })); break;
    case 'rev-remove': decided('Taken out of the batch.', labRec('Removed', 'no', 'Taken out of the batch', { decision: 'reject' })); break;
    case 'app-deny': decided('Not booked. It can come back on the next run.', pickRec('Not booked', 'no', undefined, { decision: 'deny' })); break;
    case 'app-resched': decided('Moved to ' + fmt(arg) + '.', pickRec('Rescheduled', 'book', `${(PARTNERS[ap.input.partner_id] || {}).name || ''} · New date ${fmt(arg)}`, { decision: 'reschedule', deadline: arg })); break;
    case 'rev-send': case 'app-send': { const t = a === 'rev-send' ? rv : ap; st.sent[t.id] = arg; st.sheet = null;
      // The manager does not see his own outgoing message. A made-up reply (demo) arrives a few seconds later.
      const kind = a === 'rev-send' ? 'review' : 'approval', mid = 'reply-' + t.id + arg;
      emit({ type: kind === 'review' ? 'review.send' : 'approval.send', [kind === 'review' ? 'review_id' : 'approval_id']: t.id, to: arg });
      if (st.mode === 'demo') st.rt.push(setTimeout(() => { if (st.msgs.some((m) => m.id === mid)) return; st.msgs.unshift({ id: mid, type: 'reply', from: arg, ref: kind, items: kind === 'review' ? [t.item] : (t.input.items || []),
        summary: kind === 'review' ? 'I took another look at ' + t.item + '. The label is hard to read, so I am not sure the tags are right. Can you check it once more and decide? (Demo reply)' : 'I looked at this pickup. The recycler can come, but the date is tight. Please check it and decide. (Demo reply)',
        next: kind === 'review' ? 'Open it in Items to review and answer Yes, No or Change this.' : 'Open it in Pickups to review and choose Book pickup, Reschedule or Don’t book.' }); say('New message from ' + arg + '.'); render(); }, 6000));
      say('Sent to ' + arg + '.'); render(); break; }
  }
}
function fly(dir, then) { st.exit = dir; render(); setTimeout(then, 230); }

document.addEventListener('click', (e) => {
  if (e.target.closest('[data-stop]') && !e.target.closest('[data-act]')) return;
  const el = e.target.closest('[data-act]'); if (el) { e.preventDefault(); act(el.dataset.act, el.dataset.arg); }
});
function bindSwipe() {
  const c = document.getElementById('card'); if (!c || st.exit) return;
  let x0 = null, dx = 0; const yes = c.querySelector('.stamp.yes'), no = c.querySelector('.stamp.no');
  c.style.touchAction = 'pan-y';
  c.onpointerdown = (e) => { if (e.target.closest('button')) return; x0 = e.clientX; st.dragging = true; c.setPointerCapture(e.pointerId); };
  c.onpointermove = (e) => { if (x0 === null) return; dx = e.clientX - x0; c.style.transition = 'none'; c.style.transform = `translateX(${dx}px) rotate(${dx / 24}deg)`; yes.style.opacity = Math.max(0, Math.min(1, dx / 90)); no.style.opacity = Math.max(0, Math.min(1, -dx / 90)); };
  c.onpointerup = () => { if (x0 === null) return; x0 = null; st.dragging = false;
    if (dx > 90) act('yes'); else if (dx < -90) act('no'); else { c.style.transition = 'transform .22s'; c.style.transform = ''; yes.style.opacity = no.style.opacity = 0; } dx = 0; };
  c.onpointercancel = () => { x0 = null; st.dragging = false; };
}

// ===== Agent bridge ============================================================================================
// The screens above never read agent data directly. In demo mode they replay recorded sample data. In live mode they show
// whatever an agent pushes in, and every decision the person makes is recorded as an output event. See docs/agent-bridge.md.
const Q = new URLSearchParams(location.search);
const CFG = { api: (Q.get('api') || '').replace(/\/$/, ''), adapter: Q.get('adapter') || 'events', poll: Number(Q.get('poll')) || 3000, embed: Q.get('embed') === '1', locked: Q.get('lock') === '1', origin: Q.get('origin') || '' };
let OUT = []; try { OUT = JSON.parse(localStorage.getItem('tf.outputs') || '[]'); } catch (e) { OUT = []; }
let EVN = 0, pollTimer = null, lastPull = '';
const DEMO_P = JSON.stringify(PARTNERS), DEMO_PPL = [...PEOPLE], DEMO_ITEM = { ...ITEM };

// Outputs: one event per person decision. Bodies match the Next app's API (reviews / approvals / alerts) so a backend can reuse them.
function emit(ev) {
  const e = { id: 'ev-' + Date.now().toString(36) + (++EVN), at: new Date().toISOString(), mode: st.mode, ...ev };
  if (st.mode === 'live') { OUT.push(e); try { localStorage.setItem('tf.outputs', JSON.stringify(OUT.slice(-500))); } catch (x) {} deliver(e); }
  try { window.dispatchEvent(new CustomEvent('tf:output', { detail: e })); } catch (x) {}
  try { const tgt = window.parent !== window ? window.parent : window.opener; if (tgt && CFG.origin) tgt.postMessage({ type: 'tf:output', event: e }, CFG.origin); } catch (x) {}
  return e;
}
function nextRequest(e) {
  if (e.type === 'review.decision') return ['/api/reviews/' + e.review_id, e.decision === 'edit' ? { decision: 'edit', tags: e.tags } : { decision: e.decision }];
  if (e.type === 'review.send') return ['/api/reviews/' + e.review_id, { decision: 'send', to: e.to }];
  if (e.type === 'approval.decision') return ['/api/approvals/' + e.approval_id, e.decision === 'reschedule' ? { reschedule: { deadline: e.deadline } } : { allow: e.decision === 'allow' }];
  if (e.type === 'approval.send') return ['/api/approvals/' + e.approval_id, { send: { to: e.to } }];
  if (e.type === 'alert.read') return ['/api/alerts/read', { id: e.alert_id }];
  return null;
}
function deliver(e) {
  if (!CFG.api) return;
  let url = CFG.api + '/events', body = e;
  if (CFG.adapter === 'next') { const m = nextRequest(e); if (!m) return; url = CFG.api + m[0]; body = m[1]; }
  fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
    .then((r) => { if (!r.ok) throw new Error(r.status); }).catch(() => { st.conn = 'send failed, kept locally'; render(); });
}
function exportOutputs() {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(OUT, null, 2)], { type: 'application/json' }));
  a.download = 'textile-flow-outputs.json'; document.body.appendChild(a); a.click(); a.remove();
}

// Inputs: push() upserts by id, so an agent can send the whole picture again or only what changed.
function upsert(list, inc, key, fix) {
  for (const raw of inc || []) { const x = fix ? fix(raw) : raw, i = list.findIndex((y) => key(y) === key(x));
    if (i < 0) list.push(x);
    else { const old = list[i]; if (old._t && Date.now() - old._t < 10000 && x.state === 'pending') continue; list[i] = { ...old, ...x }; } }
}
function push(inp) {
  if (!inp) return; if (st.mode !== 'live') setMode('live');
  const f = LIVE; if (inp.today) f.today = inp.today;
  for (const o of inp.items || []) {
    const row = [o.key || o.item_key, o.garment || o.garment_type || '', o.color || '', o.label || o.label_text || '', o.state || 'pending', o.stream || null, o.fibre || o.fibre_type || null, o.color_group || null, o.confidence == null ? null : o.confidence, o.condition || null, o.image || null];
    const i = f.items.findIndex((r) => r[0] === row[0]); if (i < 0) f.items.push(row); else f.items[i] = row; ITEM[row[0]] = { garment: row[1], color: row[2] };
  }
  const pend = (x) => ({ state: 'pending', ...x });
  upsert(f.reviews, inp.reviews, (x) => x.id, pend); upsert(f.approvals, inp.approvals, (x) => x.id, pend);
  upsert(f.pickups, inp.pickups, (x) => x.id); upsert(f.alerts, inp.alerts, (x) => x.id);
  for (const a of inp.alerts || []) if (a.read) st.seen[a.id] = 1;
  if (inp.partners) Object.assign(PARTNERS, inp.partners);
  if (inp.people) { PEOPLE.length = 0; PEOPLE.push(...inp.people); }
  render();
}
// The existing Next app API (/api/state) mapped to the same input shape, so this UI can sit on the current backend.
function fromNext(s) {
  return { today: s.today, partners: Object.fromEntries((s.recyclers || []).map((r) => [r.id, { name: (r.name || '').replace(' (fictional)', ''), address: r.address }])), people: (s.people || []).map((p) => p.name),
    items: (s.items || []).map((i) => ({ key: i.item_key, garment: i.garment_type, color: i.color, label: i.label_text, state: i.state, stream: i.stream, fibre: i.fibre_type, color_group: i.color_group, confidence: i.confidence, condition: i.condition })),
    reviews: (s.reviews || []).map((r) => ({ id: r.review_id, item: r.item_key, label: r.label_text, proposed: r.proposed_tags, reason: r.reason, state: r.state })),
    approvals: (s.approvals || []).map((a) => ({ id: a.approval_id, state: a.state, input: a.input })),
    pickups: (s.pickups || []).map((p) => ({ id: p.booking_id, route: p.route, partner: p.partner_id, deadline: p.deadline, n: (p.items || []).length, items: p.items, lots: p.lots })),
    alerts: (s.alerts || []).map((a) => ({ id: a.alert_id, type: a.type, summary: a.summary, items: a.items, deadline: a.deadline, next: a.next_step, ref: a.ref_kind, from: a.from_name, read: !!a.is_read })) };
}
async function pull() {
  try { const r = await fetch(CFG.api + (CFG.adapter === 'next' ? '/api/state' : '/inputs'), { cache: 'no-store' }); if (!r.ok) throw new Error(r.status);
    let j = await r.json(); if (CFG.adapter === 'next') j = fromNext(j); const key = JSON.stringify(j); st.conn = 'connected';
    if (key !== lastPull) { lastPull = key; push(j); } else render();
  } catch (e) { st.conn = 'offline'; render(); }
}
function startPoll() { clearInterval(pollTimer); pollTimer = null; if (st.mode === 'live' && CFG.api) { pull(); pollTimer = setInterval(pull, CFG.poll); } }

function setMode(m) {
  stopPlay(); st.rt.forEach(clearTimeout); st.rt = [];
  Object.assign(st, { screen: 'home', sheet: null, sent: {}, msgs: [], seen: {}, toast: null, exit: null, open: null, hist: [], hf: 'all', removed: {}, added: {}, reopen: null, edit: {}, fi: 0, mode: m, conn: '' });
  Object.keys(PARTNERS).forEach((k) => delete PARTNERS[k]); PEOPLE.length = 0; Object.keys(ITEM).forEach((k) => delete ITEM[k]); lastPull = '';
  if (m === 'live') Object.assign(LIVE, BLANK());
  else { Object.assign(PARTNERS, JSON.parse(DEMO_P)); PEOPLE.push(...DEMO_PPL); Object.assign(ITEM, DEMO_ITEM); }
  render(); if (m === 'demo') play(); startPoll();
}
window.TextileFlow = { version: 1, get mode() { return st.mode; }, clear: () => setMode('live'), demo: () => setMode('demo'), push,
  connect(o) { Object.assign(CFG, o || {}); if (CFG.api) CFG.api = CFG.api.replace(/\/$/, ''); setMode('live'); },
  on(fn) { window.addEventListener('tf:output', (e) => fn(e.detail)); }, get outputs() { return OUT.slice(); },
  clearOutputs() { OUT = []; try { localStorage.removeItem('tf.outputs'); } catch (e) {} render(); }, exportOutputs };
window.addEventListener('message', (e) => {
  if (e.origin !== (CFG.origin || location.origin) || !e.data) return;
  if (e.data.type === 'tf:input') push(e.data.payload); else if (e.data.type === 'tf:clear') setMode('live'); else if (e.data.type === 'tf:demo') setMode('demo');
});
if (Q.get('mode') === 'live') setMode('live'); else { render(); play(); }
</script></body></html>
