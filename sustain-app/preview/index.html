<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Textile Flow: demo</title><meta name="robots" content="noindex">
<style>/* Textile Flow, design B ("Calendly calm"): light, rounded, one blue accent, plain words, one job per screen.
   Plus Jakarta Sans, soft shadows, pill buttons, a floating pill tab bar. Managers see items to review, not machinery.
   This one file styles both the Next.js app and the standalone demo (preview/index.html). */
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#f3f7fd;--card:#fff;--ink:#0b3558;--mute:#4a5f75;--line:#e6eef8;--soft:#f1f5fa;
  --blue:#006bff;--blue-ink:#0050c8;--blue-soft:#e6f0ff;--blue-line:#b9d3ff;
  --green:#1a6b3c;--green-bg:#1a7f43;--green-soft:#ddf5e6;
  --amber:#8a4b00;--amber-soft:#fff1d6;--red:#b42318;--red-soft:#fde8e8;--red-line:#f3b7b7;
  --violet:#5b4bd6;--violet-soft:#eeebfd;--gate:#ffc857;
  --shadow:0 4px 20px rgba(11,53,88,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.45 "Plus Jakarta Sans",-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
button{font:inherit;font-weight:700;border:2px solid transparent;border-radius:26px;padding:12px 20px;min-height:52px;cursor:pointer;background:var(--blue);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- the app column ---- */
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden;display:flex;flex-direction:column}
@media(min-width:520px){.app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(11,53,88,.12)}}
.top{padding:12px 20px 4px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.top .back{width:44px;height:44px;min-height:44px;padding:0;border-radius:22px;background:#fff;color:var(--ink);box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:0}
.top .back svg{width:20px;height:20px}
.top h1,.hello h1{font-size:1.75rem;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.02em}
.top p.lede{margin:4px 0 0;color:var(--mute);font-size:.9rem;line-height:1.45}
.page{padding:8px 20px 24px;flex:1}
.hello{padding:12px 20px 4px}
.hello .eyebrow{display:flex;align-items:center;justify-content:space-between;height:44px;font-size:.95rem;font-weight:800;letter-spacing:0;text-transform:none;color:var(--ink)}
.hello .eyebrow .brand{display:flex;align-items:center;gap:8px}.hello .eyebrow .logo{width:28px;height:28px;border-radius:50%;background:var(--blue)}
.hello .eyebrow .date{font-size:.8rem;font-weight:600;color:var(--mute);background:#fff;border-radius:999px;padding:6px 12px;box-shadow:var(--shadow)}
.hello h1{margin:8px 0 12px}

/* who is using it (team page) */

/* all caught up (green) */
.need{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--amber-soft);color:var(--amber);border-radius:20px;padding:14px 16px;margin-bottom:12px;text-decoration:none;font-weight:800;border:0;min-height:0}
.need svg{width:24px;height:24px;flex:none}.need small{display:block;font-weight:600;font-size:.8rem;opacity:.85}
.need.ok{background:var(--green-soft);color:var(--green)}

/* the two action tiles */
.tile{display:flex;align-items:center;gap:14px;width:100%;background:#fff;color:var(--ink);border:0;border-radius:20px;padding:0 16px;margin-bottom:12px;box-shadow:var(--shadow);text-decoration:none;text-align:left;min-height:72px;font-weight:400}
.tile .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--blue-soft);color:var(--blue)}
.tile .ic svg{width:22px;height:22px}
.tile b{display:block;font-size:1rem;font-weight:700;line-height:1.25}
.tile span.d{display:block;color:var(--mute);font-size:.8125rem;margin-top:1px;font-weight:400}
.tile .n{margin-left:auto;min-width:28px;height:28px;border-radius:14px;background:var(--blue);color:#fff;font-weight:700;font-size:.875rem;display:grid;place-items:center;padding:0 8px}
.tile .n.zero{background:var(--soft);color:var(--mute)}

/* primary action + browse list */
.big{width:100%;min-height:52px;font-size:1rem;border-radius:26px;background:var(--blue);color:#fff;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.sect{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:18px 4px 8px}
.browse{background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.browse button,.browse a{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 16px;background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;text-decoration:none;font-weight:400}
.browse > :last-child{border-bottom:0}
.browse .bi{color:var(--blue);display:flex}.browse .bi svg{width:20px;height:20px}
.browse b{display:block;font-size:.9375rem;font-weight:700}.browse .d{display:block;font-size:.8125rem;color:var(--mute)}
.browse .go{margin-left:auto;color:var(--mute);display:flex}.browse .go svg{width:18px;height:18px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:8px}
.done .spin{width:36px;height:36px;border-width:5px;margin:0}
@keyframes sp{to{transform:rotate(360deg)}}
.small{font-size:.8rem;color:var(--mute)}
.foot{text-align:center;padding:14px 0 0}.foot a{font-size:.75rem;color:var(--mute)}

/* ---- review cards ---- */
.count{display:table;margin:0 auto 12px;background:#fff;color:var(--ink);font-weight:700;font-size:.8125rem;padding:5px 14px;border-radius:999px;box-shadow:var(--shadow)}
.what{font-size:.95rem;font-weight:600;color:var(--mute);margin-top:-6px;text-transform:capitalize}
.deck{position:relative;height:392px;margin-bottom:14px}
.sc{position:absolute;inset:0;background:#fff;border:0;border-radius:24px;padding:18px;box-shadow:var(--shadow);touch-action:pan-y;user-select:none;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.sc.next{transform:scale(.94) translateY(14px);opacity:.75;pointer-events:none;background:#eaf1fb;box-shadow:none}
.sc.next > *{visibility:hidden}
.sc.top-card{transform:rotate(-1deg)}
.sc-head{display:flex;align-items:center;gap:10px}
.sc-key{font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
.chip-gate{background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:4px 10px;font-weight:700;font-size:.75rem;margin-left:auto}
.label-box{border:2px dashed #c5d4e6;border-radius:14px;padding:12px 14px}
.label-box .k,.sc .k,.k{font-size:.6875rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.label-box .v{font-size:1.0625rem;font-weight:700;line-height:1.3;margin-top:6px;word-break:break-word}
.think{background:var(--blue-soft);border-radius:14px;padding:12px 14px}
.think .big-t{font-size:1.375rem;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:4px}
.think .why{color:var(--mute);font-size:.8125rem;margin-top:2px}
.ask{font-size:1rem;font-weight:700;margin-top:auto;text-align:center}
.stamp{position:absolute;top:22px;font-weight:800;font-size:1.25rem;letter-spacing:.04em;border:3px solid;border-radius:10px;padding:2px 10px;opacity:0;transform:rotate(-12deg);background:#fff}
.stamp.yes{left:18px;color:var(--green-bg);border-color:var(--green-bg)}.stamp.no{right:18px;color:var(--red);border-color:var(--red);transform:rotate(12deg)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices button{min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.1}
.choices svg{width:20px;height:20px}
.choices.three{display:flex;align-items:center;justify-content:center;gap:12px}
.choices.three button{box-shadow:var(--shadow)}
.choices.three .btn-no,.choices.three .btn-yes{width:64px;height:64px;min-height:64px;padding:0;border-radius:32px}
.choices.three .btn-no svg,.choices.three .btn-yes svg{width:26px;height:26px}
.choices.three .btn-alt{height:52px;padding:0 22px;font-size:.9375rem}
.btn-alt{background:#fff;color:var(--blue);border-color:var(--blue-line)}
.btn-no{background:#fff;color:var(--red);border-color:var(--red-line)}
.btn-yes{background:var(--green-bg);color:#fff}
.dots{display:flex;justify-content:center;gap:6px;margin-top:14px}.dots i{width:6px;height:6px;border-radius:3px;background:#b8c7d9}.dots i.on{width:22px;background:var(--blue)}
.done{background:#fff;border-radius:24px;padding:32px 20px;text-align:center;box-shadow:var(--shadow)}
.done .tick{width:72px;height:72px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin:0 auto 14px}
.done .tick svg{width:38px;height:38px}.done h2{margin:0 0 6px;font-size:1.25rem;letter-spacing:-.01em;text-transform:none;color:var(--ink);font-weight:800}.done p{margin:0;color:var(--mute);font-size:.9rem}

/* pickup card */
.pick{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px}
.pick .head{display:flex;align-items:center;justify-content:space-between}.pick .head b{font-size:1.25rem;font-weight:800}
.pick .when{display:flex;gap:12px;align-items:center}
.cal{width:64px;height:72px;border-radius:16px;background:var(--blue-soft);color:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.cal span{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.cal strong{font-size:1.75rem;font-weight:800;line-height:1.05}
.pick .who{font-size:1rem;font-weight:700;margin-top:2px}.pick .addr{display:flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--mute);margin-top:2px}.pick .addr svg{width:14px;height:14px}
.ids{display:flex;gap:6px;flex-wrap:wrap}.ids span{font-size:.8125rem;font-weight:700;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:4px 10px}
.pick .meta{display:flex;align-items:center;gap:8px;font-size:.8125rem;color:var(--mute)}.pick .meta svg{width:16px;height:16px}
.pick .actions{display:flex;flex-direction:column;gap:10px}
.pick .duo{display:flex;gap:10px}.pick .duo button{flex:1;min-height:48px}
.pick .btn-yes{background:var(--blue);color:#fff;min-height:52px;font-size:1rem}
.pick .btn-alt{border-color:var(--blue-line);color:var(--blue)}
.pick .btn-no{border-color:var(--red-line);color:var(--red)}
.pick .link{background:transparent;color:var(--mute);border:0;min-height:44px;font-size:.8125rem;font-weight:600}
.upnext{display:flex;align-items:center;gap:12px;background:#e9f0fa;border-radius:20px;padding:12px 16px;margin-top:12px;color:var(--ink)}
.upnext .k{display:block}.upnext b{display:block;font-size:.9375rem}.upnext small{display:block;color:var(--mute);font-size:.8125rem}

/* bottom sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(11,53,88,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;padding:20px 16px 26px;animation:up .22s ease-out;max-height:86vh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h3{margin:0 0 4px;font-size:1.25rem;letter-spacing:-.01em;font-weight:800}.sheet p.s{margin:0 0 14px;color:var(--mute);font-size:.875rem}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;min-height:68px;font-weight:700}
.opt .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--blue-soft);color:var(--blue)}
.opt .ic svg{width:22px;height:22px}.opt b{display:block;font-size:1rem;line-height:1.2}.opt span.d{display:block;color:var(--mute);font-weight:400;font-size:.8125rem;margin-top:2px}
.opt.warn .ic{background:var(--amber-soft);color:var(--amber)}.opt.bad .ic{background:var(--red-soft);color:var(--red)}
.sheet .cancel{width:100%;background:transparent;color:var(--mute);border:0;min-height:48px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:12px 20px;font-weight:700;font-size:.9rem;z-index:60;box-shadow:var(--shadow);max-width:92vw;text-align:center}

/* messages, history */
.note{display:flex;gap:12px;background:#fff;border:0;border-radius:20px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);position:relative}
.note.unread::after{content:"";position:absolute;right:16px;top:18px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.note-ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--blue-soft);color:var(--blue)}
.note-ico svg{width:20px;height:20px}
.n-ok,.n-warn,.n-ask{background:var(--blue-soft);color:var(--blue)}
.note h4{margin:0 0 2px;font-size:.9375rem;font-weight:700;padding-right:18px}.note p{margin:2px 0;color:var(--mute);font-size:.8125rem;line-height:1.4}.note .nx{font-weight:700;color:var(--ink)}
.note .tag{display:block;margin-top:6px;font-size:.6875rem;font-weight:700;letter-spacing:.06em;color:#7a8ca1;text-transform:uppercase}
.note a.open{display:inline-block;margin-top:8px;font-weight:700;text-decoration:none;background:var(--blue-soft);padding:8px 16px;border-radius:12px}
.empty{color:var(--mute);padding:26px;text-align:center;background:#fff;border:2px dashed var(--line);border-radius:20px}
.err{color:var(--red);font-weight:700}
.chips{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap}
.chips button{min-height:36px;padding:0 14px;border-radius:18px;font-size:.8125rem;background:#fff;color:var(--mute);box-shadow:var(--shadow);border:0}
.chips button.on{background:var(--blue);color:#fff}
.hgroup{margin:0 0 12px}.hgroup .sect{margin-top:8px}
.hlist{background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.hrow{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .ic{width:36px;height:36px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}.hrow .ic svg{width:18px;height:18px}
.hrow .t{flex:1;min-width:0}.hrow .t b{display:block;font-size:.875rem;line-height:20px;font-weight:700}.hrow .t small{display:block;font-size:.75rem;color:var(--mute);line-height:1.3;margin-top:2px}
.hrow .r{width:84px;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.hrow .chg{width:84px;min-height:36px;display:grid;place-items:center;padding:0;background:transparent;color:var(--blue);border:0;border-radius:12px;font-size:.8125rem}
.st{display:inline-block;font-size:.75rem;font-weight:700;border-radius:999px;padding:3px 10px}
.st-ok{background:var(--green-soft);color:var(--green)}.st-book{background:var(--blue-soft);color:var(--blue-ink)}.st-no{background:var(--red-soft);color:var(--red)}.st-seen{background:#e8eef5;color:var(--mute)}

/* floating pill tab bar */
.tabbar{position:sticky;bottom:12px;margin:0 16px 12px;height:56px;border-radius:28px;background:#fff;box-shadow:0 4px 20px rgba(11,53,88,.14);display:flex;align-items:center;padding:0 4px;gap:2px;flex:none;z-index:30}
.tabbar a{flex:1;height:48px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:24px;color:var(--mute);text-decoration:none;font-size:.75rem;font-weight:700;position:relative}
.tabbar a svg{width:22px;height:22px}
.tabbar a.on{flex:2;background:var(--blue-soft);color:var(--blue)}
.tabbar a .pip{position:absolute;top:8px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--blue);border:2px solid #fff}
.tabbar a.on .pip{display:none}

/* ---- tech team page: cost + feed, plain table ---- */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.metric{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);border-top:4px solid var(--blue)}
.metric label{display:block;font-size:.75rem;font-weight:700;color:var(--mute)}
.metric b{display:block;font-size:1.6rem;letter-spacing:-.04em;line-height:1.1;margin:2px 0 0}.metric small{color:var(--mute);font-size:.72rem}
.m-green{border-top-color:var(--green-bg)}.m-amber{border-top-color:var(--gate)}.m-red{border-top-color:var(--red)}.m-violet{border-top-color:var(--violet)}
h2{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:22px 0 10px;font-weight:700}
.tbl{background:#fff;border-radius:14px;overflow:auto;box-shadow:var(--shadow);max-height:360px}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th{position:sticky;top:0;background:var(--soft);text-align:left;color:var(--mute);font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
.key{font-weight:700}.sub{color:var(--mute)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.72rem;font-weight:700}
.p-tagged,.p-allowed,.p-approved,.p-edited,.p-sent{background:var(--green-soft);color:var(--green)}
.p-held,.p-pending{background:var(--amber-soft);color:var(--amber)}
.p-rejected,.p-denied{background:var(--red-soft);color:var(--red)}
.p-new,.p-none{background:var(--soft);color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:8px;font-size:.72rem;font-weight:700;margin:0 6px 4px 0;background:var(--soft);color:var(--mute);border:1px solid var(--line)}
.conf{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-weight:700}.bar{width:44px;height:6px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%}
.sw{width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.18);display:inline-block}
.sw-whites{background:#fff}.sw-darks{background:#2b2f3a}.sw-brights{background:linear-gradient(135deg,#ff5d73,#ffb347)}.sw-mixed{background:conic-gradient(#ff5d73,#ffb347,#4ade80,#38bdf8,#a855f7,#ff5d73)}
.feed{font:.68rem/1.65 ui-monospace,"SF Mono",Menlo,monospace;max-height:240px;overflow:auto;background:#0b3558;color:#cfe0f5;border-radius:16px;padding:14px}.feed div b{color:#7dd3a8;font-weight:600}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button.alt{background:#fff;color:var(--ink);border-color:var(--line)}
button.no{background:#fff;color:var(--red);border-color:var(--red-line)}

/* demo-only chrome (preview/index.html): iPhone 13 frame on wide screens + a "this is a recording" strip */
.demo-strip{background:var(--amber-soft);color:var(--amber);font-size:.72rem;font-weight:700;text-align:center;padding:6px 10px}
.demo-strip button{min-height:0;padding:3px 10px;border-radius:8px;font-size:.72rem;margin-left:8px;background:#fff;color:var(--ink);border:1px solid #e8d49a}
.sbar{display:none}
@media(min-width:520px){
  body.demo{padding:24px 0;background:#dce6f5}
  body.demo .app{width:390px;max-width:none;height:min(844px,calc(100vh - 48px));border-radius:50px;overflow:hidden;box-shadow:0 30px 80px rgba(11,53,88,.28),0 0 0 12px #0e0e10}
  body.demo .app::before{content:"";position:absolute;top:0;left:50%;margin-left:-81px;width:162px;height:34px;background:#0e0e10;border-radius:0 0 22px 22px;z-index:70}
  body.demo .app::after{content:"";position:absolute;bottom:8px;left:50%;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:#0e0e10;z-index:70}
  body.demo .sbar{display:flex;align-items:center;justify-content:space-between;height:47px;padding:4px 30px 0 36px;flex:none;font-size:.9375rem;font-weight:600}
  body.demo .sbar span{display:flex;gap:6px;align-items:center}
  body.demo .tabbar{margin-bottom:28px;bottom:0}
  body.demo .toast{position:absolute;bottom:100px}
  body.demo .sheet-bg{position:absolute}
}
body.demo .scroll{flex:1;overflow-y:auto}

async function act(a, arg) {
  const rv = curRev(), ap = curApp();
  const go = { home: 'home', check: 'check', pickups: 'pickups', messages: 'messages', history: 'history', guide: 'guide' };
  if (go[a]) { st.reopen = null; st.screen = go[a]; st.sheet = null; render(); const sc = document.querySelector('.scroll'); if (sc) sc.scrollTop = 0; return; }
  const pickRec = (status, tone, sub, d = {}) => { const i = ap.input || {}; return { id: 'h' + (++hid), src: ap, ev: { type: 'approval.decision', approval_id: ap.id, route: i.route, partner_id: i.partner_id, items: itemsOf(ap), items_added: st.added[ap.id] || [], items_removed: st.removed[ap.id] || [], ...d }, app: { id: ap.id, input: { ...ap.input, items: itemsOf(ap) } }, k: 'pickup', title: ROUTE[i.route] || i.route, sub: sub || `${(PARTNERS[i.partner_id] || {}).name || ''} · ${plural(itemsOf(ap).length, 'item')} · ${fmt(i.deadline)}`, status, tone }; };
  const labRec = (status, tone, sub, d = {}) => ({ id: 'h' + (++hid), src: rv, ev: { type: 'review.decision', review_id: rv.id, item: rv.item, ...d }, rev: rv, k: 'label', title: `${rv.item} ${garment(rv.item)}`.trim(), sub, status, tone });
  switch (a) {
    case 'restart': stopPlay(); Object.assign(st, { reopen: null, edit: {}, fi: 0, screen: 'home', sheet: null, sent: {}, msgs: [], seen: {}, toast: null, exit: null, open: null, hist: [], hf: 'all', removed: {}, added: {}, reopen: null, edit: {} }); st.rt.forEach(clearTimeout); st.rt = []; render(); play(); break;
    case 'hf': st.hf = arg; render(); break;
    case 'clear': setMode('live'); break;
    case 'demo': setMode('demo'); break;
    case 'export': exportOutputs(); break;
    case 'hist-back': st.reopen = null; st.sheet = null; st.screen = 'history'; render(); break;
    case 'change': { const rec = historyRecords().find((h) => h.id === arg); if (!rec) break; st.reopen = { rec, rev: rec.rev, app: rec.app }; st.screen = rec.k === 'label' ? 'check' : 'pickups'; st.sheet = null; render(); const sc = document.querySelector('.scroll'); if (sc) sc.scrollTop = 0; break; }
    case 'app-edit': st.sheet = 'app-edit'; render(); break;
    case 'app-add': (st.added[ap.id] = st.added[ap.id] || []).push(arg); render(); break;
    case 'app-toggle': { const g = st.removed[ap.id] || []; st.removed[ap.id] = g.includes(arg) ? g.filter((x) => x !== arg) : [...g, arg]; if (st.removed[ap.id].length >= baseItems(ap).length) st.removed[ap.id] = g; render(); break; }
    case 'closesheet': st.sheet = null; render(); break;
    case 'msgopen': if (!st.seen[arg]) emit({ type: 'alert.read', alert_id: arg }); st.seen[arg] = 1; st.open = arg; st.sheet = 'msg'; render(); break;
    case 'doc': st.doc = arg; st.sheet = 'doc'; render(); break;
    case 'yes':
      if (st.screen === 'check' && rv && rv.proposed) fly('right', () => decided('Saved. Thank you.', labRec('Accepted', 'ok', pile(rv.proposed.stream), { decision: 'approve', tags: rv.proposed })));
      else if (st.screen === 'pickups' && ap) decided('Booked. Thank you.', pickRec('Booked', 'book', undefined, { decision: 'allow' }));
      break;
    case 'no': fly('left', () => { st.exit = null; st.sheet = 'rev-options'; render(); }); break;
    case 'rev-fix': case 'rev-who': case 'rev-options': case 'app-who': case 'app-options': case 'app-date': st.sheet = a; render(); break;
    case 'rev-pile': decided('Saved as ' + arg.toLowerCase() + '.', labRec('Changed', 'book', arg, { decision: 'edit', tags: { ...(rv.proposed || {}), stream: Object.keys(PILE).find((k) => PILE[k][0] === arg) } })); break;
    case 'rev-remove': decided('Taken out of the batch.', labRec('Removed', 'no', 'Taken out of the batch', { decision: 'reject' })); break;
    case 'app-deny': decided('Not booked. It can come back on the next run.', pickRec('Not booked', 'no', undefined, { decision: 'deny' })); break;
    case 'app-date-save':
    case 'app-resched': {
      if (st.savingDate) break;
      const date = a === 'app-date-save' ? document.getElementById('pickup-date')?.value : arg;
      if (!date || date < F().today || date === ap.input.deadline) { say('Choose a different date, today or later.'); break; }
      const reopened = !!st.reopen;
      const rec = pickRec('Rescheduled', 'book', `${(PARTNERS[ap.input.partner_id] || {}).name || ''} · New date ${fmt(date)}`,
        { decision: 'reschedule', deadline: date, ...(reopened ? { reopened: true, previous_deadline: ap.input.deadline } : {}) });
      rec.id = 'pickup-' + ap.id;
      rec.app.originalDeadline = ap.originalDeadline || ap.input.deadline;
      rec.app.input.deadline = date;
      if (st.mode === 'live' && CFG.api) {
        st.savingDate = true;
        try {
          await deliver(emit(rec.ev, false), true);
          const approval = F().approvals.find((entry) => entry.id === ap.id);
          if (approval) { approval.state = 'rescheduled'; approval.resched_to = date; }
          decided('Moved to ' + fmt(date) + '.', rec, false);
          if (approval) approval.state = 'rescheduled';
          render();
          void pull();
        } catch (error) {
          say(error.message || 'Could not save the date.');
          render();
        } finally { st.savingDate = false; }
      } else {
        decided('Moved to ' + fmt(date) + '.', rec);
      }
      break;
    }
    case 'rev-send': case 'app-send': { const t = a === 'rev-send' ? rv : ap; st.sent[t.id] = arg; st.sheet = null;
      // The manager does not see his own outgoing message. A made-up reply (demo) arrives a few seconds later.
      const kind = a === 'rev-send' ? 'review' : 'approval', mid = 'reply-' + t.id + arg;
      emit({ type: kind === 'review' ? 'review.send' : 'approval.send', [kind === 'review' ? 'review_id' : 'approval_id']: t.id, to: arg });
      if (st.mode === 'demo') st.rt.push(setTimeout(() => { if (st.msgs.some((m) => m.id === mid)) return; st.msgs.unshift({ id: mid, type: 'reply', from: arg, ref: kind, items: kind === 'review' ? [t.item] : (t.input.items || []),
        summary: kind === 'review' ? 'I took another look at ' + t.item + '. The label is hard to read, so I am not sure the tags are right. Can you check it once more and decide? (Demo reply)' : 'I looked at this pickup. The recycler can come, but the date is tight. Please check it and decide. (Demo reply)',
        next: kind === 'review' ? 'Open it in Items to review and answer Yes, No or Change this.' : 'Open it in Pickups to review and choose Book pickup, Reschedule or Don’t book.' }); say('New message from ' + arg + '.'); render(); }, 6000));
      say('Sent to ' + arg + '.'); render(); break; }
  }
}

function bindSwipe() {
  const c = document.getElementById('card'); if (!c || st.exit) return;
  let x0 = null, dx = 0; const yes = c.querySelector('.stamp.yes'), no = c.querySelector('.stamp.no');
  c.style.touchAction = 'pan-y';
  c.onpointerdown = (e) => { if (e.target.closest('button')) return; x0 = e.clientX; st.dragging = true; c.setPointerCapture(e.pointerId); };
  c.onpointermove = (e) => { if (x0 === null) return; dx = e.clientX - x0; c.style.transition = 'none'; c.style.transform = `translateX(${dx}px) rotate(${dx / 24}deg)`; yes.style.opacity = Math.max(0, Math.min(1, dx / 90)); no.style.opacity = Math.max(0, Math.min(1, -dx / 90)); };
  c.onpointerup = () => { if (x0 === null) return; x0 = null; st.dragging = false;
    if (dx > 90) act('yes'); else if (dx < -90) act('no'); else { c.style.transition = 'transform .22s'; c.style.transform = ''; yes.style.opacity = no.style.opacity = 0; } dx = 0; };
  c.onpointercancel = () => { x0 = null; st.dragging = false; };
}

// ===== Agent bridge ============================================================================================
// The screens above never read agent data directly. In demo mode they replay recorded sample data. In live mode they show
// whatever an agent pushes in, and every decision the person makes is recorded as an output event. See docs/agent-bridge.md.
const Q = new URLSearchParams(location.search);
const CFG = { api: (Q.get('api') || '').replace(/\/$/, ''), adapter: Q.get('adapter') || 'events', poll: Number(Q.get('poll')) || 3000, embed: Q.get('embed') === '1', locked: Q.get('lock') === '1', origin: Q.get('origin') || '' };
let OUT = []; try { OUT = JSON.parse(localStorage.getItem('tf.outputs') || '[]'); } catch (e) { OUT = []; }
let EVN = 0, pollTimer = null, lastPull = '';
const DEMO_P = JSON.stringify(PARTNERS), DEMO_PPL = [...PEOPLE], DEMO_ITEM = { ...ITEM };

// Outputs: one event per person decision. Bodies match the Next app's API (reviews / approvals / alerts) so a backend can reuse them.
function emit(ev, send = true) {
  const e = { id: 'ev-' + Date.now().toString(36) + (++EVN), at: new Date().toISOString(), mode: st.mode, ...ev };
  if (st.mode === 'live') { OUT.push(e); try { localStorage.setItem('tf.outputs', JSON.stringify(OUT.slice(-500))); } catch (x) {} if (send) deliver(e); }
  try { window.dispatchEvent(new CustomEvent('tf:output', { detail: e })); } catch (x) {}
  try { const tgt = window.parent !== window ? window.parent : window.opener; if (tgt && CFG.origin) tgt.postMessage({ type: 'tf:output', event: e }, CFG.origin); } catch (x) {}
  return e;
}
function nextRequest(e) {
  if (e.type === 'review.decision') return ['/api/reviews/' + e.review_id, e.decision === 'edit' ? { decision: 'edit', tags: e.tags } : { decision: e.decision }];
  if (e.type === 'review.send') return ['/api/reviews/' + e.review_id, { decision: 'send', to: e.to }];
  if (e.type === 'approval.decision') return ['/api/approvals/' + e.approval_id, e.decision === 'reschedule' ? { reschedule: { deadline: e.deadline, previous: e.previous_deadline } } : { allow: e.decision === 'allow' }];
  if (e.type === 'approval.send') return ['/api/approvals/' + e.approval_id, { send: { to: e.to } }];
  if (e.type === 'alert.read') return ['/api/alerts/read', { id: e.alert_id }];
  return null;
}
function deliver(e, propagate = false) {
  if (!CFG.api) return;
  let url = CFG.api + '/events', body = e;
  if (CFG.adapter === 'next') { const m = nextRequest(e); if (!m) return; url = CFG.api + m[0]; body = m[1]; }
  return fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
    .then(async (r) => {
      if (!r.ok) throw new Error((await r.json().catch(() => null))?.error || 'Could not save the decision.');
    }).catch((error) => { if (propagate) throw error; st.conn = 'send failed, kept locally'; render(); });
}
function exportOutputs() {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(OUT, null, 2)], { type: 'application/json' }));
  a.download = 'textile-flow-outputs.json'; document.body.appendChild(a); a.click(); a.remove();
}

// Inputs: push() upserts by id, so an agent can send the whole picture again or only what changed.
function upsert(list, inc, key, fix) {
  for (const raw of inc || []) { const x = fix ? fix(raw) : raw, i = list.findIndex((y) => key(y) === key(x));
    if (i < 0) list.push(x);
    else { const old = list[i]; if (old._t && Date.now() - old._t < 10000 && x.state === 'pending') continue; list[i] = { ...old, ...x }; } }
}
function push(inp) {
  if (!inp) return; if (st.mode !== 'live') setMode('live');
  const f = LIVE; if (inp.today) f.today = inp.today;
  for (const o of inp.items || []) {
    const row = [o.key || o.item_key, o.garment || o.garment_type || '', o.color || '', o.label || o.label_text || '', o.state || 'pending', o.stream || null, o.fibre || o.fibre_type || null, o.color_group || null, o.confidence == null ? null : o.confidence, o.condition || null, o.image || null];
    const i = f.items.findIndex((r) => r[0] === row[0]); if (i < 0) f.items.push(row); else f.items[i] = row; ITEM[row[0]] = { garment: row[1], color: row[2] };
  }
  const pend = (x) => ({ state: 'pending', ...x });
  upsert(f.reviews, inp.reviews, (x) => x.id, pend); upsert(f.approvals, inp.approvals, (x) => x.id, pend);
  upsert(f.pickups, inp.pickups, (x) => x.id); upsert(f.alerts, inp.alerts, (x) => x.id);
  for (const a of inp.alerts || []) if (a.read) st.seen[a.id] = 1;
  if (inp.partners) Object.assign(PARTNERS, inp.partners);
  if (inp.people) { PEOPLE.length = 0; PEOPLE.push(...inp.people); }
  render();
}
// The existing Next app API (/api/state) mapped to the same input shape, so this UI can sit on the current backend.
function fromNext(s) {
  return { today: s.today, partners: Object.fromEntries((s.recyclers || []).map((r) => [r.id, { name: (r.name || '').replace(' (fictional)', ''), address: r.address }])), people: (s.people || []).map((p) => p.name),
    items: (s.items || []).map((i) => ({ key: i.item_key, garment: i.garment_type, color: i.color, label: i.label_text, state: i.state, stream: i.stream, fibre: i.fibre_type, color_group: i.color_group, confidence: i.confidence, condition: i.condition })),
    reviews: (s.reviews || []).map((r) => ({ id: r.review_id, item: r.item_key, label: r.label_text, proposed: r.proposed_tags, reason: r.reason, state: r.state })),
    approvals: (s.approvals || []).map((a) => ({ id: a.approval_id, state: a.state, input: a.input, resched_to: a.resched_to })),
    pickups: (s.pickups || []).map((p) => ({ id: p.booking_id, route: p.route, partner: p.partner_id, deadline: p.deadline, n: (p.items || []).length, items: p.items, lots: p.lots })),
    alerts: (s.alerts || []).map((a) => ({ id: a.alert_id, type: a.type, summary: a.summary, items: a.items, deadline: a.deadline, next: a.next_step, ref: a.ref_kind, from: a.from_name, read: !!a.is_read })) };
}
async function pull() {
  if (st.sheet === 'app-date') return;
  try { const r = await fetch(CFG.api + (CFG.adapter === 'next' ? '/api/state' : '/inputs'), { cache: 'no-store' }); if (!r.ok) throw new Error(r.status);
    let j = await r.json(); if (CFG.adapter === 'next') j = fromNext(j); const key = JSON.stringify(j); st.conn = 'connected';
    if (key !== lastPull) { lastPull = key; push(j); } else render();
  } catch (e) { st.conn = 'offline'; render(); }
}
function startPoll() { clearInterval(pollTimer); pollTimer = null; if (st.mode === 'live' && CFG.api) { pull(); pollTimer = setInterval(pull, CFG.poll); } }

function setMode(m) {
  stopPlay(); st.rt.forEach(clearTimeout); st.rt = [];
  Object.assign(st, { screen: 'home', sheet: null, sent: {}, msgs: [], seen: {}, toast: null, exit: null, open: null, hist: [], hf: 'all', removed: {}, added: {}, reopen: null, edit: {}, fi: 0, mode: m, conn: '' });
  Object.keys(PARTNERS).forEach((k) => delete PARTNERS[k]); PEOPLE.length = 0; Object.keys(ITEM).forEach((k) => delete ITEM[k]); lastPull = '';
  if (m === 'live') Object.assign(LIVE, BLANK());
  else { Object.assign(PARTNERS, JSON.parse(DEMO_P)); PEOPLE.push(...DEMO_PPL); Object.assign(ITEM, DEMO_ITEM); }
  render(); if (m === 'demo') play(); startPoll();
}
window.TextileFlow = { version: 1, get mode() { return st.mode; }, clear: () => setMode('live'), demo: () => setMode('demo'), push,
  connect(o) { Object.assign(CFG, o || {}); if (CFG.api) CFG.api = CFG.api.replace(/\/$/, ''); setMode('live'); },
  on(fn) { window.addEventListener('tf:output', (e) => fn(e.detail)); }, get outputs() { return OUT.slice(); },
  clearOutputs() { OUT = []; try { localStorage.removeItem('tf.outputs'); } catch (e) {} render(); }, exportOutputs };
window.addEventListener('message', (e) => {
  if (e.origin !== (CFG.origin || location.origin) || !e.data) return;
  if (e.data.type === 'tf:input') push(e.data.payload); else if (e.data.type === 'tf:clear') setMode('live'); else if (e.data.type === 'tf:demo') setMode('demo');
});
if (Q.get('mode') === 'live') setMode('live'); else { render(); play(); }
</script></body></html>
