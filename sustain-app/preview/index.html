<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Textile Flow: replay preview</title>
<style>/* Design language: Box (white workspace, Box blue, metric cards, metadata table, gradient AI action)
   + Flighty (flight-card layout, big status numerals, yellow gate chip, dark floating nav pill, navy gradient header).
   Own colours, own icons: inspired by, not copied from, either product. */
:root{
  --bg:#f3f5f9;--card:#fff;--ink:#0d1220;--mute:#667085;--line:#e4e8ef;--soft:#f7f8fb;
  --blue:#0061d5;--blue-soft:#e8f1fd;--navy1:#0a0c3a;--navy2:#1a1f86;
  --green:#18a058;--green-soft:#e6f6ee;--amber:#d98a00;--amber-soft:#fff4dc;--red:#d92d3a;--red-soft:#fdebec;
  --violet:#6d3fd6;--violet-soft:#f0eafc;--gate:#f7c948;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}

/* shell */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;font-weight:800;font-size:17px;letter-spacing:-.2px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--ink);display:grid;place-items:center}
.logo svg{width:20px;height:20px}
.side a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#3b4457;text-decoration:none;font-weight:600}
.side a svg{width:20px;height:20px;flex:none}
.side a:hover{background:var(--soft)}.side a.on{background:var(--blue-soft);color:var(--blue)}
.side .sp{flex:1}
.side .meta{font-size:12px;color:var(--mute);padding:10px 12px;border-top:1px solid var(--line)}
.badge{background:var(--red);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;font-weight:700;margin-left:auto}
.content{min-width:0}
main{max-width:1080px;margin:0 auto;padding:0 24px 60px}

/* hero (Flighty navy header) */
.hero{background:linear-gradient(135deg,var(--navy1),var(--navy2));color:#fff;padding:30px 24px 78px}
.hero-in{max-width:1080px;margin:0 auto;display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.hero h1{font-size:34px;line-height:1.05;margin:0;letter-spacing:-.8px;font-weight:800}
.hero p{margin:8px 0 0;color:#c6cbf5;max-width:560px}
.hero .grow{flex:1;min-width:260px}.eyebrow{font-size:12px;letter-spacing:.9px;text-transform:uppercase;color:#9aa3ff;font-weight:700;margin-bottom:6px}
.pull{margin-top:-52px}

/* buttons */
button{font:inherit;font-weight:700;border:1px solid transparent;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--ink);color:#fff}
button.alt{background:#fff;color:var(--ink);border-color:var(--line)}
button.go{background:var(--green)}button.no{background:#fff;color:var(--red);border-color:#f0b9be}
button.wide{width:100%;padding:12px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-ai{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#e0a24a,#a855f7,#38bdf8) border-box;border:2px solid transparent;color:var(--blue);border-radius:999px;padding:11px 24px;box-shadow:0 6px 18px rgba(99,102,241,.18)}
.btn-ai:disabled{box-shadow:none}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}

/* cards + metric cards (Box dashboard) */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);border-top:4px solid var(--blue)}
.metric label{display:block;font-size:13px;font-weight:700;color:#3b4457}
.metric b{display:block;font-size:34px;letter-spacing:-1px;line-height:1.1;margin:4px 0 0}
.metric small{color:var(--mute);font-size:12px}
.m-green{border-top-color:var(--green)}.m-amber{border-top-color:var(--gate)}.m-red{border-top-color:var(--red)}.m-violet{border-top-color:var(--violet)}
h2{font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);margin:26px 0 10px;font-weight:800}
.sub{color:var(--mute)}.err{color:var(--red);font-weight:600}
.empty{color:var(--mute);padding:26px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:14px}

/* metadata table (Box) */
.tbl{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto;box-shadow:var(--shadow);max-height:460px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;background:var(--soft);text-align:left;color:#3b4457;font-size:12px;letter-spacing:.4px;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}tr:hover td{background:#fafbfd}
.key{font-weight:700}.lbl{color:#3b4457;max-width:260px}
.conf{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-weight:700}
.bar{width:54px;height:6px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%}

/* chips + status pills */
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.p-tagged,.p-allowed,.p-approved,.p-edited,.p-sent{background:var(--green-soft);color:var(--green)}
.p-held,.p-pending{background:var(--amber-soft);color:var(--amber)}
.p-rejected,.p-denied{background:var(--red-soft);color:var(--red)}
.p-new,.p-none{background:var(--soft);color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:8px;font-size:12px;font-weight:700;margin:0 6px 4px 0;background:var(--soft);color:#3b4457;border:1px solid var(--line)}
.c-shred{background:var(--green-soft);color:var(--green);border-color:transparent}.c-denim{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.c-mixed{background:var(--violet-soft);color:var(--violet);border-color:transparent}.c-trash{background:var(--red-soft);color:var(--red);border-color:transparent}
.c-gate{background:var(--gate);color:#2b2100;border-color:transparent;font-size:14px;padding:5px 12px}
.sw{width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.18);display:inline-block}
.sw-whites{background:#fff}.sw-darks{background:#2b2f3a}.sw-brights{background:linear-gradient(135deg,#ff5d73,#ffb347)}.sw-mixed{background:conic-gradient(#ff5d73,#ffb347,#4ade80,#38bdf8,#a855f7,#ff5d73)}

/* flight-style card (Flighty) used for review items and pickup bookings */
.fc{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.fc.gate{border:2px solid var(--gate);box-shadow:0 0 0 4px rgba(247,201,72,.18),var(--shadow)}
.fc-head{display:flex;gap:12px;align-items:center}
.fc-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);flex:none}
.fc-ico svg{width:20px;height:20px}
.fc-t{font-weight:800;font-size:17px;letter-spacing:-.2px}.fc-s{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.fc-status{margin:14px 0 4px;padding:10px 14px;background:var(--soft);border-radius:12px;font-weight:700}
.fc-status small{display:block;color:var(--mute);font-weight:500}
.fc-leg{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line)}
.fc-leg:last-of-type{border-bottom:0}
.fc-k{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.fc-big{font-size:34px;font-weight:800;letter-spacing:-1.2px;line-height:1.05;font-variant-numeric:tabular-nums}
.fc-big.ok{color:var(--green)}.fc-big.warn{color:var(--amber)}.fc-big.bad{color:var(--red)}
.fc-mid{font-size:18px;font-weight:700;line-height:1.2}
.fc-act{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.fc-act button:first-child{flex:1}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.tagrow label{font-size:12px;color:var(--mute);font-weight:700}.tagrow select,.tagrow input{display:block;margin-top:3px}

/* alert notifications (Flighty) */
.note{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);position:relative}
.note.unread::after{content:"";position:absolute;right:14px;top:16px;width:9px;height:9px;border-radius:50%;background:var(--blue)}
.note-ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.note-ico svg{width:21px;height:21px}
.n-ok{background:var(--green-soft);color:var(--green)}.n-warn{background:var(--amber-soft);color:var(--amber)}
.note h4{margin:0 0 2px;font-size:16px;letter-spacing:-.2px}.note p{margin:2px 0;color:#3b4457}.note .nx{font-weight:700;color:var(--ink)}

/* live feed */
.feed{font:12px/1.65 ui-monospace,"SF Mono",Menlo,monospace;max-height:240px;overflow:auto;background:linear-gradient(135deg,#0b0d2e,#14186b);color:#cfd6ff;border-radius:16px;padding:14px}
.feed div b{color:#7dd3a8;font-weight:600}

/* mobile: sidebar becomes a floating dark pill (Flighty) */
@media(max-width:860px){
  .shell{display:block}
  .side{position:fixed;left:12px;right:12px;bottom:12px;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:8px;border-radius:999px;background:rgba(13,18,32,.94);border:0;z-index:20;backdrop-filter:blur(8px)}
  .side .brand,.side .sp,.side .meta{display:none}
  .side a{flex-direction:column;gap:2px;padding:6px 12px;color:#aab2c8;font-size:11px;position:relative}
  .side a.on{background:rgba(255,255,255,.14);color:#fff}
  .badge{position:absolute;top:0;right:4px;margin:0;font-size:10px}
  main{padding:0 14px 110px}.hero{padding:22px 16px 70px}.hero h1{font-size:28px}
}

.ctl{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:8px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;backdrop-filter:blur(6px)}
.ctl .note2{font-weight:700}.ctl .pos{margin-left:auto;color:var(--mute);font-size:13px}.ctl span.tag{background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.side a{cursor:pointer}.hide{display:none!important}
@media(max-width:860px){.ctl{padding:8px 12px}}
