<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Textile Flow: replay preview</title><meta name="robots" content="noindex">
<style>/* Textile Flow: mobile-first, one job per screen, large type for people with little tech experience.
   Look: Box (white workspace, Box blue, plain tables for the tech page) + Flighty (navy gradient header,
   flight-style cards, big status numerals, yellow "needs you" chip). Own colours and icons.
   This one file styles both the Next.js app and the standalone demo (preview/index.html). */
:root{
  --bg:#eef1f6;--card:#fff;--ink:#0d1220;--mute:#5b6577;--line:#e1e6ee;--soft:#f5f7fb;
  --blue:#0061d5;--blue-soft:#e8f1fd;--navy1:#0a0c3a;--navy2:#1a1f86;
  --green:#127a43;--green-bg:#18a058;--green-soft:#e3f5ec;--amber:#a86500;--amber-soft:#fff3d6;--red:#c4202c;--red-soft:#fdeaec;
  --violet:#6d3fd6;--violet-soft:#f0eafc;--gate:#f7c948;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 10px 28px rgba(16,24,40,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:19px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.45 Inter,-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
button{font:inherit;font-weight:700;border:2px solid transparent;border-radius:16px;padding:14px 20px;min-height:56px;cursor:pointer;background:var(--ink);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* ---- the app column ---- */
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden;display:flex;flex-direction:column}
@media(min-width:520px){.app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(16,24,40,.12)}}
.top{background:linear-gradient(135deg,var(--navy1),var(--navy2));color:#fff;padding:14px 16px 56px;display:flex;align-items:center;gap:12px}
.top .back{background:rgba(255,255,255,.14);color:#fff;border-radius:999px;min-height:48px;padding:0 18px 0 12px;display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-weight:700}
.top .back svg{width:22px;height:22px}
.top h1{font-size:1.45rem;margin:0;letter-spacing:-.4px;line-height:1.1;flex:1}
.page{padding:0 16px 40px;margin-top:-38px;flex:1}
.hello{background:linear-gradient(135deg,var(--navy1),var(--navy2));color:#fff;padding:26px 18px 66px}
.hello .eyebrow{font-size:.74rem;letter-spacing:1px;text-transform:uppercase;color:#9aa3ff;font-weight:800}
.hello h1{font-size:2rem;line-height:1.05;margin:6px 0 16px;letter-spacing:-.8px}

/* who is using it */
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.14);border-radius:999px;padding:4px}
.seg button{background:transparent;color:#cfd6ff;border-radius:999px;min-height:50px;padding:8px 10px;font-size:.95rem}
.seg button.on{background:#fff;color:var(--navy2)}

/* "this needs you" banner (Flighty yellow chip) */
.need{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--gate);color:#2b2100;border-radius:20px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow);text-decoration:none;font-weight:800;font-size:1.05rem;border:0}
.need svg{width:28px;height:28px;flex:none}.need small{display:block;font-weight:600;font-size:.8rem;opacity:.8}
.need.ok{background:var(--green-soft);color:var(--green)}

/* three big task buttons */
.tile{display:flex;align-items:center;gap:14px;width:100%;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:18px 16px;margin-bottom:12px;box-shadow:var(--shadow);text-decoration:none;text-align:left;min-height:104px}
.tile .ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:none;background:var(--blue-soft);color:var(--blue)}
.tile .ic svg{width:30px;height:30px}
.tile.t2 .ic{background:var(--violet-soft);color:var(--violet)}.tile.t3 .ic{background:var(--amber-soft);color:var(--amber)}
.tile b{display:block;font-size:1.3rem;letter-spacing:-.4px;line-height:1.15}
.tile span.d{display:block;color:var(--mute);font-size:.88rem;margin-top:2px}
.tile .n{margin-left:auto;min-width:46px;height:46px;border-radius:23px;background:var(--red);color:#fff;font-weight:800;font-size:1.25rem;display:grid;place-items:center;padding:0 10px}
.tile .n.zero{background:var(--soft);color:var(--mute);border:1px solid var(--line)}
.tile .chev{margin-left:auto;color:var(--mute)}

/* the single "start" action on Home */
.start{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;margin:18px 0 6px;box-shadow:var(--shadow)}
.start h3{margin:0 0 4px;font-size:1.1rem}.start p{margin:0 0 12px;color:var(--mute);font-size:.9rem}
.big{width:100%;min-height:64px;font-size:1.15rem;border-radius:20px}
.big.go{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#e0a24a,#a855f7,#38bdf8) border-box;border:3px solid transparent;color:var(--blue)}
.prog{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:12px 0 6px}.prog i{display:block;height:100%;background:var(--green-bg);transition:width .4s}
.done .spin{width:40px;height:40px;border-width:5px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.small{font-size:.8rem;color:var(--mute)}
.foot{text-align:center;padding:18px 0 4px}.foot a{font-size:.8rem;color:var(--mute)}

/* ---- swipe cards ---- */
.count{display:table;margin:0 auto 12px;background:#fff;color:var(--ink);font-weight:800;font-size:.85rem;padding:5px 16px;border-radius:999px;box-shadow:var(--shadow)}
.what{font-size:1.05rem;font-weight:600;color:#3b4457;margin-top:-4px;text-transform:capitalize}
.deck{position:relative;height:430px;margin-bottom:14px}
.sc{position:absolute;inset:0;background:#fff;border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:var(--shadow);touch-action:pan-y;user-select:none;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.sc.next{transform:scale(.94) translateY(14px);opacity:.7;pointer-events:none}
.sc.gate{border:3px solid var(--gate);box-shadow:0 0 0 5px rgba(247,201,72,.2),var(--shadow)}
.sc-head{display:flex;align-items:center;gap:10px}
.sc-key{font-weight:800;font-size:1.4rem;letter-spacing:-.4px}
.chip-gate{background:var(--gate);color:#2b2100;border-radius:10px;padding:4px 12px;font-weight:800;font-size:.8rem;margin-left:auto}
.label-box{border:2px dashed #b7c0d1;border-radius:16px;padding:12px 14px;background:#fbfcfe}
.label-box .k,.sc .k{font-size:.72rem;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mute)}
.label-box .v{font-size:1.15rem;font-weight:700;line-height:1.3;margin-top:4px;word-break:break-word}
.think{background:var(--soft);border-radius:16px;padding:12px 14px}
.think .big-t{font-size:1.5rem;font-weight:800;letter-spacing:-.5px;line-height:1.1;margin-top:2px}
.think .why{color:var(--mute);font-size:.85rem;margin-top:4px}
.ask{font-size:1.05rem;font-weight:700;margin-top:auto;text-align:center}
.stamp{position:absolute;top:22px;font-weight:900;font-size:1.5rem;letter-spacing:1px;border:4px solid;border-radius:12px;padding:2px 12px;opacity:0;transform:rotate(-12deg)}
.stamp.yes{left:18px;color:var(--green-bg);border-color:var(--green-bg)}.stamp.no{right:18px;color:var(--red);border-color:var(--red);transform:rotate(12deg)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices button{min-height:76px;font-size:1.1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
.choices svg{width:28px;height:28px}
.choices.three{grid-template-columns:1fr 1fr 1fr;gap:8px}.choices.three button{min-height:84px;font-size:.88rem;padding:10px 4px}.choices.three svg{width:26px;height:26px}
.btn-alt{background:#fff;color:var(--blue);border-color:#b7cff3}
.btn-no{background:#fff;color:var(--red);border-color:#f0b9be}
.btn-yes{background:var(--green-bg);color:#fff}
.hint{text-align:center;color:var(--mute);font-size:.85rem;margin-top:12px}
.waitline{background:var(--amber-soft);color:var(--amber);border-radius:16px;padding:12px 14px;font-weight:700;margin-top:12px;font-size:.92rem}
.done{background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px 20px;text-align:center;box-shadow:var(--shadow)}
.done .tick{width:84px;height:84px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin:0 auto 14px}
.done .tick svg{width:46px;height:46px}.done h2{margin:0 0 6px;font-size:1.5rem;letter-spacing:-.4px;text-transform:none;color:var(--ink)}.done p{margin:0;color:var(--mute)}

/* big pickup numerals */
.dl{font-size:2.4rem;font-weight:800;letter-spacing:-1.2px;line-height:1;color:var(--amber)}
.items-line{font-size:.9rem;color:#3b4457;word-break:break-word}

/* bottom sheet: "What would you like to do?" */
.sheet-bg{position:fixed;inset:0;background:rgba(13,18,32,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:28px 28px 0 0;padding:20px 16px 26px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h3{margin:0 0 4px;font-size:1.4rem;letter-spacing:-.4px}.sheet p.s{margin:0 0 14px;color:var(--mute);font-size:.9rem}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px;min-height:76px}
.opt .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--blue-soft);color:var(--blue)}
.opt .ic svg{width:26px;height:26px}.opt b{display:block;font-size:1.1rem;line-height:1.15}.opt span.d{display:block;color:var(--mute);font-weight:500;font-size:.82rem;margin-top:2px}
.opt.warn .ic{background:var(--amber-soft);color:var(--amber)}.opt.bad .ic{background:var(--red-soft);color:var(--red)}
.sheet .cancel{width:100%;background:transparent;color:var(--mute);border:0;min-height:50px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:14px 22px;font-weight:700;z-index:60;box-shadow:var(--shadow);max-width:92vw;text-align:center}

/* messages (Flighty-style notifications) */
.note{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);position:relative}
.note.unread{border-color:#9db8f0}
.note.unread::after{content:"";position:absolute;right:14px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--blue)}
.note-ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.note-ico svg{width:24px;height:24px}
.n-ok{background:var(--green-soft);color:var(--green)}.n-warn{background:var(--amber-soft);color:var(--amber)}.n-ask{background:var(--blue-soft);color:var(--blue)}
.note h4{margin:0 0 3px;font-size:1.05rem;letter-spacing:-.2px;padding-right:18px}.note p{margin:2px 0;color:#3b4457;font-size:.9rem}.note .nx{font-weight:700;color:var(--ink)}
.note a.open{display:inline-block;margin-top:8px;font-weight:800;text-decoration:none;background:var(--blue-soft);padding:8px 16px;border-radius:12px}
.empty{color:var(--mute);padding:26px;text-align:center;background:#fff;border:2px dashed var(--line);border-radius:22px}
.err{color:var(--red);font-weight:700}

/* ---- tech team page (cost + feed): Box-style metric cards and plain table ---- */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);border-top:4px solid var(--blue)}
.metric label{display:block;font-size:.78rem;font-weight:700;color:#3b4457}
.metric b{display:block;font-size:1.7rem;letter-spacing:-1px;line-height:1.1;margin:2px 0 0}.metric small{color:var(--mute);font-size:.72rem}
.m-green{border-top-color:var(--green-bg)}.m-amber{border-top-color:var(--gate)}.m-red{border-top-color:var(--red)}.m-violet{border-top-color:var(--violet)}
h2{font-size:.78rem;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);margin:22px 0 10px;font-weight:800}
.tbl{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto;box-shadow:var(--shadow);max-height:360px}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th{position:sticky;top:0;background:var(--soft);text-align:left;color:#3b4457;font-size:.68rem;letter-spacing:.4px;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
.key{font-weight:700}.sub{color:var(--mute)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.72rem;font-weight:700}
.p-tagged,.p-allowed,.p-approved,.p-edited,.p-sent{background:var(--green-soft);color:var(--green)}
.p-held,.p-pending{background:var(--amber-soft);color:var(--amber)}
.p-rejected,.p-denied{background:var(--red-soft);color:var(--red)}
.p-new,.p-none{background:var(--soft);color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:8px;font-size:.72rem;font-weight:700;margin:0 6px 4px 0;background:var(--soft);color:#3b4457;border:1px solid var(--line)}
.conf{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-weight:700}.bar{width:44px;height:6px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%}
.sw{width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.18);display:inline-block}
.sw-whites{background:#fff}.sw-darks{background:#2b2f3a}.sw-brights{background:linear-gradient(135deg,#ff5d73,#ffb347)}.sw-mixed{background:conic-gradient(#ff5d73,#ffb347,#4ade80,#38bdf8,#a855f7,#ff5d73)}
.feed{font:.68rem/1.65 ui-monospace,"SF Mono",Menlo,monospace;max-height:240px;overflow:auto;background:linear-gradient(135deg,#0b0d2e,#14186b);color:#cfd6ff;border-radius:16px;padding:14px}.feed div b{color:#7dd3a8;font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button.alt{background:#fff;color:var(--ink);border-color:var(--line)}
button.no{background:#fff;color:var(--red);border-color:#f0b9be}

/* demo-only chrome (preview/index.html): phone frame on wide screens + a "this is a recording" strip */
.demo-strip{background:#fff7d6;color:#5c4400;font-size:.72rem;font-weight:700;text-align:center;padding:6px 10px;border-bottom:1px solid #f0dc8b}
.demo-strip button{min-height:0;padding:3px 10px;border-radius:8px;font-size:.72rem;margin-left:8px;background:#fff;color:var(--ink);border:1px solid #d9c46b}
@media(min-width:520px){body.demo{padding:24px 0;background:#dfe4ee}body.demo .app{min-height:0;height:min(860px,calc(100vh - 48px));border-radius:36px;overflow:hidden;box-shadow:0 30px 80px rgba(16,24,40,.28),0 0 0 10px #10131f}body.demo .page,body.demo .scroll{overflow-y:auto}}
body.demo .scroll{flex:1;overflow-y:auto}

.reqdoc{border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;background:#fbfcfe}.reqdoc h4{margin:0 0 6px;font-size:1.1rem}.reqdoc p{margin:4px 0;font-size:.9rem}
@media print{.top,.hello,.foot,.choices,.sheet button.cancel,.sheet button.big,.toast{display:none!important}}
button.note.tap{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:0}
.note .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg-body{font-size:1.05rem;line-height:1.45;margin:8px 0;color:var(--ink)}.msg-body.nx{font-weight:700}
.big-link{border:0;width:100%;cursor:pointer;font-family:inherit;display:block;text-align:center;margin-top:12px;font-weight:800;text-decoration:none;background:var(--blue);color:#fff;padding:18px;border-radius:16px;font-size:1.1rem}
</style></head>

  if (st.dragging) return;
  const strip = `<div class="demo-strip">Demo: a recorded run. Whatever you choose, the story continues the same way.<button data-act="restart">Restart</button></div>`;
  const body = st.screen === 'check' ? check() : st.screen === 'pickups' ? pickups() : st.screen === 'messages' ? messages() : home();
  document.getElementById('app').innerHTML = strip + `<div class="scroll">${body}</div>` + sheets() + (st.toast ? `<div class="toast" role="status">${esc(st.toast)}</div>` : '');
  bindSwipe();
}

function act(a, arg) {
  const rv = queue(pendRev())[0], ap = queue(pendApp())[0];
  const go = { home: 'home', check: 'check', pickups: 'pickups', messages: 'messages' };
  if (go[a]) { st.screen = go[a]; st.sheet = null; render(); return; }
  switch (a) {
    case 'restart': stopPlay(); Object.assign(st, { fi: 0, screen: 'home', sheet: null, sent: {}, msgs: [], seen: {}, toast: null, exit: null, open: null }); st.rt.forEach(clearTimeout); st.rt = []; render(); break;
    case 'startintake': play(); render(); break;
    case 'startdisp': st.fi++; play(); render(); break; // step off the 'intake finished' frame, then the Disposition run plays
    case 'closesheet': st.sheet = null; render(); break;
    case 'msgopen': st.seen[arg] = 1; st.open = arg; st.sheet = 'msg'; render(); break;
    case 'doc': st.doc = arg; st.sheet = 'doc'; render(); break;
    case 'yes': if (st.screen === 'check' && rv && rv.proposed) fly('right', () => decided('Saved. Thank you.')); else if (st.screen === 'pickups' && ap) fly('right', () => decided('Booked. Thank you.')); break;
    case 'no': fly('left', () => { st.exit = null; st.sheet = st.screen === 'check' ? 'rev-options' : 'app-options'; render(); }); break;
    case 'rev-fix': case 'rev-who': case 'rev-options': case 'app-who': case 'app-options': case 'app-date': st.sheet = a; render(); break;
    case 'rev-pile': decided('Saved as ' + arg.toLowerCase() + '.'); break;
    case 'rev-remove': decided('Taken out of the batch.'); break;
    case 'app-deny': decided('Not booked. It can come back on the next run.'); break;
    case 'app-resched': decided('Moved to ' + arg + '.'); break;
    case 'rev-send': case 'app-send': { const t = a === 'rev-send' ? rv : ap; st.sent[t.id] = arg; st.sheet = null;
      // The manager does not see his own outgoing message. A made-up reply (demo) arrives a few seconds later.
      const kind = a === 'rev-send' ? 'review' : 'approval', mid = 'reply-' + t.id + arg;
      st.rt.push(setTimeout(() => { if (st.msgs.some((m) => m.id === mid)) return; st.msgs.unshift({ id: mid, type: 'reply', from: arg, ref: kind, items: kind === 'review' ? [t.item] : (t.input.items || []),
        summary: kind === 'review' ? 'I took another look at ' + t.item + '. The label is hard to read, so I am not sure the tags are right. Can you check it once more and decide? (Demo reply)' : 'I looked at this pickup. The recycler can come, but the date is tight. Please check it and decide. (Demo reply)',
        next: kind === 'review' ? 'Open it in Check labels and answer Yes, No or Change this.' : 'Open it in Approve pickups and choose Book it, Reschedule or Do not book.' }); say('New message from ' + arg + '.'); render(); }, 6000));
      say('Sent to ' + arg + '.'); render(); break; }
  }
}
function fly(dir, then) { st.exit = dir; render(); setTimeout(then, 230); }

document.addEventListener('click', (e) => {
  if (e.target.closest('[data-stop]') && !e.target.closest('[data-act]')) return;
  const el = e.target.closest('[data-act]'); if (el) act(el.dataset.act, el.dataset.arg);
});
function bindSwipe() {
  const c = document.getElementById('card'); if (!c || st.exit) return;
  let x0 = null, dx = 0; const yes = c.querySelector('.stamp.yes'), no = c.querySelector('.stamp.no');
  c.style.touchAction = 'pan-y';
  c.onpointerdown = (e) => { if (e.target.closest('button')) return; x0 = e.clientX; st.dragging = true; c.setPointerCapture(e.pointerId); };
  c.onpointermove = (e) => { if (x0 === null) return; dx = e.clientX - x0; c.style.transition = 'none'; c.style.transform = `translateX(${dx}px) rotate(${dx / 24}deg)`; yes.style.opacity = Math.max(0, Math.min(1, dx / 90)); no.style.opacity = Math.max(0, Math.min(1, -dx / 90)); };
  c.onpointerup = () => { if (x0 === null) return; x0 = null; st.dragging = false;
    if (dx > 90) act('yes'); else if (dx < -90) act('no'); else { c.style.transition = 'transform .22s'; c.style.transform = ''; yes.style.opacity = no.style.opacity = 0; } dx = 0; };
  c.onpointercancel = () => { x0 = null; st.dragging = false; };
}
render();
</script></body></html>
